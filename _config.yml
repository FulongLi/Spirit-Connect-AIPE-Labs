title: "Spirit Connect AIPE Labs"
description: "Open power electronics knowledge and design resources for coding agents"
email: "info@spiritconnect.co.uk"
url: "https://aipel.co.uk"
baseurl: ""
timezone: Europe/London

# AIPE Community and newsletter backend (Supabase; see docs/community/setup.md).
# The project URL and anon key are public values restricted by row-level
# security; leave them blank until the project exists, and the forms then say
# that the service is not yet open. Never put the service-role key, Buttondown
# key or any other secret here.
community_backend:
  supabase_url: ""
  supabase_anon_key: ""
  turnstile_site_key: ""

permalink: /resources/blog/:title/

# English is the default publishing language. A translated post overrides this
# with `lang: zh` and keeps the same slug (or supplies a shared
# `translation_key`) so the language switch can discover its counterpart.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      lang: en
  - scope:
      path: ""
      type: explorations
    values:
      layout: exploration

# AIPE Explorations: open research questions and investigations. English entries
# live in _explorations/ and Chinese entries in _explorations/zh/; each sets its
# own `lang` and `permalink` (see docs/exploration-template.md).
collections:
  explorations:
    output: true

exclude:
  - README.md
  - LICENSE.md
  - Gemfile
  - Gemfile.lock
  - .bundle
  - vendor
  - tools
  - tests
  - docs
  - requirements-dev.txt
  - aipe.yaml
  - .ecosystem-sources
  - .idea
  - .gitignore
  - package.json
  - package-lock.json
  - node_modules
  - supabase
  - .env.example

# GitHub Pages' builder otherwise renders Markdown files without front matter (aipe.md, the v0 resource index)
# as site pages; those files are raw endpoints. Their former page URLs redirect (legacy/aipe-*.md).
require_front_matter: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
