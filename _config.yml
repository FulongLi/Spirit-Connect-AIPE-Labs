title: "Spirit Connect AIPE Labs"
description: "Open power electronics knowledge and design resources for coding agents"
email: "info@spiritconnect.co.uk"
url: "https://aipel.co.uk"
baseurl: ""
timezone: Europe/London

permalink: /resources/blog/:title/

# English is the default publishing language. A translated post overrides this
# with `lang: zh` and keeps the same slug (or supplies a shared
# `translation_key`) so the language switch can discover its counterpart.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      lang: en

exclude:
  - README.md
  - LICENSE.md
  - Gemfile
  - Gemfile.lock
  - .bundle
  - vendor
  - tools
  - .idea
  - .gitignore

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
