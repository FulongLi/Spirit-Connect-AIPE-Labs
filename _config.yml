title: "Spirit Connect AIPE Labs"
description: "An open platform for AI in power engineering — engineering knowledge, databases, tools, specialist agents and workflows across devices, magnetics, converters and systems."
email: "info@spiritconnect.co.uk"
url: "https://aipel.co.uk"
baseurl: ""
timezone: Europe/London

permalink: /resources/blog/:title/

sass:
