  - README.md
  - LICENSE.md
  - Gemfile
  - Gemfile.lock
  - tools
  - vendor
  - .bundle
  - .claude
  - .idea
  - .gitignore

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
