name: Ecosystem presentation validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/sync_ecosystem.py --check
      - run: python tools/hub_data.py --check
      - run: python tools/content_data.py --check
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - id: sources
        run: python tools/academy_source_lock.py
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.sources.outputs.repository }}
          ref: ${{ steps.sources.outputs.revision }}
          path: .ecosystem-sources/academy
          persist-credentials: false
      - run: python tools/build_academy.py .ecosystem-sources/academy
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.6.9'
          bundler-cache: true
      - run: bundle exec jekyll build --strict_front_matter
      - run: python tools/check_public_build.py _site
      - run: python tools/check_site_links.py _site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7
  # GitHub Pages deploys main with its own "legacy" builder (the github-pages gem, Jekyll 3.x), not the Jekyll 4
  # build above. Build the unchanged checkout with that engine and check the public routes it produces.
  pages-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: sudo chown -R "$USER" _site
      - run: python tools/check_public_build.py _site
      - run: python tools/check_site_links.py _site
