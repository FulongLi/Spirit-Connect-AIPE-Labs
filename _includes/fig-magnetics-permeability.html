{%- assign zh = false -%}{%- if include.lang == 'zh' -%}{%- assign zh = true -%}{%- endif -%}
<figure class="db-figure">
  <span class="db-figure-title">{% if zh %}直流偏磁下的磁导率{% else %}Permeability under DC bias{% endif %}</span>
  <svg viewBox="0 0 440 268" role="img" aria-label="{% if zh %}初始磁导率百分比随磁场强度的下降曲线{% else %}Percent of initial permeability versus magnetising force for several core materials{% endif %}">
    <g class="fig-grid">
      <line x1="147" y1="26" x2="147" y2="228"/>
      <line x1="228" y1="26" x2="228" y2="228"/>
      <line x1="309" y1="26" x2="309" y2="228"/>
      <line x1="66" y1="177" x2="392" y2="177"/>
      <line x1="66" y1="127" x2="392" y2="127"/>
      <line x1="66" y1="76" x2="392" y2="76"/>
    </g>
    <path class="fig-axis" d="M66,26 V228 H392"/>
    <g class="fig-tick" text-anchor="middle">
      <text x="66" y="244">0</text>
      <text x="147" y="244">50</text>
      <text x="228" y="244">100</text>
      <text x="309" y="244">150</text>
      <text x="390" y="244">200</text>
    </g>
    <g class="fig-tick" text-anchor="end">
      <text x="58" y="232">0</text>
      <text x="58" y="181">25</text>
      <text x="58" y="131">50</text>
      <text x="58" y="80">75</text>
      <text x="58" y="30">100</text>
    </g>
    <text class="fig-axis-label" x="229" y="262" text-anchor="middle">H<tspan dy="3" font-size="8">dc</tspan><tspan dy="-3"> (Oe)</tspan></text>
    <text class="fig-axis-label" x="18" y="127" text-anchor="middle" transform="rotate(-90 18 127)">{% if zh %}初始磁导率 (%){% else %}% of initial µ{% endif %}</text>
    <path class="fig-line fig-dash" stroke="var(--fig-1)" d="M66,28 L268,32 C296,38 318,86 330,150 C338,196 344,216 348,226"/>
    <path class="fig-line" stroke="var(--fig-2)" d="M66,28 C124,36 176,70 228,108 C285,148 345,180 390,192"/>
    <path class="fig-line" stroke="var(--fig-3)" d="M66,28 C120,40 170,86 228,127 C285,166 345,188 390,197"/>
    <path class="fig-line" stroke="var(--fig-4)" d="M66,28 C118,46 168,96 228,137 C285,174 345,194 390,202"/>
    <g class="fig-series" transform="translate(84,146)">
      <line class="fig-line-thin fig-dash" stroke="var(--fig-1)" x1="0" y1="0" x2="22" y2="0"/>
      <text class="fig-note" x="30" y="4">{% if zh %}加气隙铁氧体{% else %}gapped ferrite{% endif %}</text>
      <line class="fig-line-thin" stroke="var(--fig-2)" x1="0" y1="18" x2="22" y2="18"/>
      <text class="fig-note" x="30" y="22">{% if zh %}高磁通 60 µ{% else %}high-flux 60 µ{% endif %}</text>
      <line class="fig-line-thin" stroke="var(--fig-3)" x1="0" y1="36" x2="22" y2="36"/>
      <text class="fig-note" x="30" y="40">MPP 60 µ</text>
      <line class="fig-line-thin" stroke="var(--fig-4)" x1="0" y1="54" x2="22" y2="54"/>
      <text class="fig-note" x="30" y="58">{% if zh %}铁硅铝 60 µ{% else %}sendust 60 µ{% endif %}</text>
    </g>
    <text class="fig-note" x="340" y="126" text-anchor="middle" transform="rotate(78 340 126)">{% if zh %}硬饱和{% else %}hard saturation{% endif %}</text>
  </svg>
  <figcaption>
    {% if zh %}
      <b>电感量随直流电流变化。</b>粉芯是软饱和，铁氧体是硬饱和——不存这条曲线，PFC 电感或 Buck 电感的纹波电流在满载时就会被严重低估。库中记录 µ(H<sub>dc</sub>, T) 与对应的 L–I 曲线。
    {% else %}
      <b>Inductance is a function of DC current.</b> Powder cores roll off softly, gapped ferrite saturates hard. Without this curve, ripple current in a PFC or buck inductor is badly under-predicted at full load, so µ(H<sub>dc</sub>, T) and the resulting L–I curve are stored per material and per core.
    {% endif %}
  </figcaption>
</figure>
