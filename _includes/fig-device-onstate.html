{%- assign zh = false -%}{%- if include.lang == 'zh' -%}{%- assign zh = true -%}{%- endif -%}
<figure class="db-figure">
  <span class="db-figure-title">{% if zh %}导通特性：单极型 vs 双极型{% else %}On-state: unipolar vs. bipolar conduction{% endif %}</span>
  <svg viewBox="0 0 440 268" role="img" aria-label="{% if zh %}MOSFET 与 IGBT 导通压降随电流的对比{% else %}On-state voltage versus current for a unipolar MOSFET and a bipolar IGBT{% endif %}">
    <g class="fig-grid">
      <line x1="131" y1="26" x2="131" y2="228"/>
      <line x1="196" y1="26" x2="196" y2="228"/>
      <line x1="261" y1="26" x2="261" y2="228"/>
      <line x1="326" y1="26" x2="326" y2="228"/>
      <line x1="66" y1="160" x2="392" y2="160"/>
      <line x1="66" y1="92" x2="392" y2="92"/>
      <line x1="66" y1="24" x2="392" y2="24"/>
    </g>
    <path class="fig-axis" d="M66,26 V228 H392"/>
    <g class="fig-tick" text-anchor="middle">
      <text x="66" y="244">0</text>
      <text x="131" y="244">1</text>
      <text x="196" y="244">2</text>
      <text x="261" y="244">3</text>
      <text x="326" y="244">4</text>
      <text x="390" y="244">5</text>
    </g>
    <g class="fig-tick" text-anchor="end">
      <text x="58" y="232">0</text>
      <text x="58" y="164">20</text>
      <text x="58" y="96">40</text>
      <text x="58" y="28">60</text>
    </g>
    <text class="fig-axis-label" x="229" y="262" text-anchor="middle">{% if zh %}导通压降 (V){% else %}on-state voltage (V){% endif %}</text>
    <text class="fig-axis-label" x="18" y="127" text-anchor="middle" transform="rotate(-90 18 127)">{% if zh %}电流 (A){% else %}current (A){% endif %}</text>

    <path class="fig-line" stroke="var(--fig-2)" d="M66,228 L163,24"/>
    <path class="fig-line fig-dash" stroke="var(--fig-2)" d="M66,228 L261,24"/>
    <path class="fig-line" stroke="var(--fig-3)" d="M66,228 L108,228 C126,222 141,168 153,118 C161,82 170,44 176,24"/>
    <path class="fig-line fig-dash" stroke="var(--fig-3)" d="M66,228 L104,228 C124,223 150,170 164,118 C173,82 183,44 190,24"/>

    <circle cx="142" cy="149" r="4" fill="var(--fig-ink)"/>
    <line class="fig-guide" x1="142" y1="149" x2="142" y2="228"/>
    <text class="fig-note" x="150" y="196">{% if zh %}高温交点 —— 以上电流{% else %}hot crossover — above this{% endif %}</text>
    <text class="fig-note" x="150" y="210">{% if zh %}IGBT 反而更优{% else %}current the IGBT wins{% endif %}</text>

    <g transform="translate(276,42)">
      <line class="fig-line-thin" stroke="var(--fig-2)" x1="0" y1="0" x2="22" y2="0"/>
      <text class="fig-note" x="30" y="4">MOSFET, 25 °C</text>
      <line class="fig-line-thin fig-dash" stroke="var(--fig-2)" x1="0" y1="17" x2="22" y2="17"/>
      <text class="fig-note" x="30" y="21">MOSFET, 150 °C</text>
      <line class="fig-line-thin" stroke="var(--fig-3)" x1="0" y1="34" x2="22" y2="34"/>
      <text class="fig-note" x="30" y="38">IGBT, 25 °C</text>
      <line class="fig-line-thin fig-dash" stroke="var(--fig-3)" x1="0" y1="51" x2="22" y2="51"/>
      <text class="fig-note" x="30" y="55">IGBT, 150 °C</text>
    </g>
  </svg>
  <figcaption>
    {% if zh %}
      <b>两条曲线的形状就是两种导通机理。</b>单极型器件的漂移区按欧姆导电，曲线过原点且随温度变陡（正温度系数，便于并联）；
      双极型器件靠少子注入实现电导调制，曲线是一个结压降加一段小电阻，因而在大电流下压降更低，但代价是关断时必须抽走存储电荷。
    {% else %}
      <b>The shape of each curve <em>is</em> the conduction mechanism.</b> A unipolar device conducts ohmically through its drift region:
      the line passes through the origin and steepens with temperature — a positive coefficient, which is what makes parallelling safe.
      A bipolar device conductivity-modulates its drift region with injected minority carriers: a junction offset plus a small resistance,
      lower at high current, but that stored charge has to be swept out again at turn-off.
    {% endif %}
  </figcaption>
</figure>
