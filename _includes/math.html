{% if page.math %}
<script>
// Kramdown emits math/tex script elements. Expose their TeX as delimiters
// before MathJax 3 starts, preserving readable source if the CDN is offline.
document.querySelectorAll('.post-article script[type^="math/tex"]').forEach(source => {
  const display = source.type.includes('mode=display');
  const target = document.createElement(display ? 'div' : 'span');
  target.className = display ? 'math-display' : 'math-inline';
  target.textContent = (display ? '\\[' : '\\(') + source.textContent + (display ? '\\]' : '\\)');
  source.replaceWith(target);
});
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
  svg: { fontCache: 'global' }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<noscript><p class="container">Enable JavaScript to typeset the mathematical equations on this page.</p></noscript>
{% endif %}
