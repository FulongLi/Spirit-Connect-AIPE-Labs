<script>
const burger = document.querySelector('.hamburger');
const menu   = document.getElementById('mainmenu');
if (burger && menu){
  burger.addEventListener('click', () => {
    const open = menu.classList.toggle('open');
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
}
document.querySelectorAll('.drop-toggle').forEach(btn => {
  btn.addEventListener('click', (e) => {
    const dd = e.currentTarget.closest('.dropdown');
    dd.classList.toggle('open');
    btn.setAttribute('aria-expanded', dd.classList.contains('open') ? 'true' : 'false');
  });
  btn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); btn.click(); }
  });
});
document.querySelectorAll('[data-copy-target]').forEach(btn => {
  const idleLabel = btn.textContent.trim();
  const copiedLabel = btn.dataset.copiedLabel || 'Copied!';
  btn.addEventListener('click', () => {
    const el = document.getElementById(btn.dataset.copyTarget);
    if (!el) return;
    const text = el.textContent.trim();
    const done = () => {
      btn.classList.add('copied');
      btn.textContent = copiedLabel;
      setTimeout(() => { btn.classList.remove('copied'); btn.textContent = idleLabel; }, 2000);
    };
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  });
});
document.querySelectorAll('.faq-item').forEach(item => {
  const q = item.querySelector('.faq-q');
  const a = item.querySelector('.faq-a');
  if (!q || !a) return;
  q.addEventListener('click', () => {
    const isOpen = item.classList.toggle('open');
    q.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    a.style.maxHeight = isOpen ? a.scrollHeight + 'px' : null;
  });
});
window.addEventListener('resize', () => {
  document.querySelectorAll('.faq-item.open .faq-a').forEach(a => {
    a.style.maxHeight = a.scrollHeight + 'px';
  });
});

document.querySelectorAll('[data-post-toc]').forEach(toc => {
  const shell = toc.closest('.post-content-shell');
  const article = shell && shell.querySelector('.blog-post-article');
  if (!article) return;

  const headings = Array.from(article.querySelectorAll('h2'));
  const usedIds = new Set(Array.from(document.querySelectorAll('[id]')).map(element => element.id));
  const links = [{ target: article, link: toc.querySelector('a[href="#article-overview"]') }];

  headings.forEach((heading, index) => {
    if (!heading.id) {
      let candidate = `article-section-${index + 1}`;
      while (usedIds.has(candidate)) candidate += '-section';
      heading.id = candidate;
      usedIds.add(candidate);
    }
    const link = document.createElement('a');
    link.href = `#${heading.id}`;
    link.textContent = heading.textContent.trim();
    link.title = heading.textContent.trim();
    toc.appendChild(link);
    links.push({ target: heading, link });
  });

  if (headings.length > 7) toc.closest('.post-page-nav').classList.add('has-long-toc');

  toc.addEventListener('click', event => {
    const link = event.target.closest('a[href^="#"]');
    if (!link) return;
    const target = document.getElementById(link.hash.slice(1));
    if (!target) return;
    event.preventDefault();
    const previousScrollBehaviour = document.documentElement.style.scrollBehavior;
    document.documentElement.style.scrollBehavior = 'auto';
    target.scrollIntoView({ block: 'start' });
    window.history.pushState(null, '', link.hash);
    window.requestAnimationFrame(() => {
      document.documentElement.style.scrollBehavior = previousScrollBehaviour;
    });
  });

  let scheduled = false;
  const updateCurrentSection = () => {
    const threshold = 150;
    let current = links[0];
    links.slice(1).forEach(item => {
      if (item.target.getBoundingClientRect().top <= threshold) current = item;
    });
    links.forEach(item => {
      const active = item === current;
      item.link.classList.toggle('is-active', active);
      if (active) item.link.setAttribute('aria-current', 'location');
      else item.link.removeAttribute('aria-current');
    });
    scheduled = false;
  };
  const scheduleUpdate = () => {
    if (scheduled) return;
    scheduled = true;
    window.requestAnimationFrame(updateCurrentSection);
  };
  window.addEventListener('scroll', scheduleUpdate, { passive: true });
  window.addEventListener('resize', scheduleUpdate);
  updateCurrentSection();
});

const showcaseVideos = document.querySelectorAll('.agent-tool-video');
if (showcaseVideos.length) {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  showcaseVideos.forEach(video => {
    if (reduceMotion) {
      video.removeAttribute('autoplay');
      video.pause();
    }
  });

  if (!reduceMotion && 'IntersectionObserver' in window) {
    const videoObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const video = entry.target;
        if (entry.isIntersecting) {
          const playback = video.play();
          if (playback && playback.catch) playback.catch(() => {});
        } else {
          video.pause();
        }
      });
    }, { rootMargin: '80px 0px', threshold: 0.15 });
    showcaseVideos.forEach(video => videoObserver.observe(video));
  }
}
</script>
