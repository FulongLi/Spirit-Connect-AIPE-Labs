{%- assign zh = false -%}{%- if include.lang == 'zh' -%}{%- assign zh = true -%}{%- endif -%}
<figure class="db-figure">
  <span class="db-figure-title">{% if zh %}开关损耗与电流、结温{% else %}Switching energy vs. current and T<sub>j</sub>{% endif %}</span>
  <svg viewBox="0 0 440 268" role="img" aria-label="{% if zh %}开通与关断能量随漏极电流在两个结温下的变化{% else %}Turn-on and turn-off energy versus drain current at two junction temperatures{% endif %}">
    <g class="fig-grid">
      <line x1="147" y1="26" x2="147" y2="228"/>
      <line x1="228" y1="26" x2="228" y2="228"/>
      <line x1="309" y1="26" x2="309" y2="228"/>
      <line x1="66" y1="177" x2="390" y2="177"/>
      <line x1="66" y1="126" x2="390" y2="126"/>
      <line x1="66" y1="75" x2="390" y2="75"/>
      <line x1="66" y1="24" x2="390" y2="24"/>
    </g>
    <path class="fig-axis" d="M66,26 V228 H392"/>
    <g class="fig-tick" text-anchor="middle">
      <text x="66" y="244">0</text>
      <text x="147" y="244">10</text>
      <text x="228" y="244">20</text>
      <text x="309" y="244">30</text>
      <text x="390" y="244">40</text>
    </g>
    <g class="fig-tick" text-anchor="end">
      <text x="58" y="232">0</text>
      <text x="58" y="181">200</text>
      <text x="58" y="130">400</text>
      <text x="58" y="79">600</text>
      <text x="58" y="28">800</text>
    </g>
    <text class="fig-axis-label" x="228" y="262" text-anchor="middle">I<tspan dy="3" font-size="8">D</tspan><tspan dy="-3"> (A)</tspan></text>
    <text class="fig-axis-label" x="18" y="127" text-anchor="middle" transform="rotate(-90 18 127)">E<tspan dy="3" font-size="8">sw</tspan><tspan dy="-3"> (µJ)</tspan></text>
    <path class="fig-line" stroke="var(--fig-1)" d="M66,228 C140,196 250,140 390,86"/>
    <path class="fig-line fig-dash" stroke="var(--fig-1)" d="M66,228 C140,186 250,120 390,52"/>
    <path class="fig-line" stroke="var(--fig-3)" d="M66,228 C150,212 260,190 390,166"/>
    <path class="fig-line fig-dash" stroke="var(--fig-3)" d="M66,228 C150,208 260,182 390,152"/>
    <g class="fig-series">
      <text x="396" y="80" fill="var(--fig-1)">E<tspan dy="3" font-size="8">on</tspan></text>
      <text x="396" y="164" fill="var(--fig-3)">E<tspan dy="3" font-size="8">off</tspan></text>
    </g>
    <g transform="translate(84,40)">
      <line class="fig-line-thin" stroke="var(--fig-label)" x1="0" y1="0" x2="22" y2="0"/>
      <text class="fig-note" x="30" y="4">T<tspan dy="3" font-size="8">j</tspan><tspan dy="-3"> = 25 °C</tspan></text>
      <line class="fig-line-thin fig-dash" stroke="var(--fig-label)" x1="0" y1="18" x2="22" y2="18"/>
      <text class="fig-note" x="30" y="22">T<tspan dy="3" font-size="8">j</tspan><tspan dy="-3"> = 150 °C</tspan></text>
    </g>
  </svg>
  <figcaption>
    {% if zh %}
      <b>损耗模型的输入。</b>E<sub>on</sub>/E<sub>off</sub> 以 (I, V<sub>DC</sub>, T<sub>j</sub>, R<sub>g</sub>) 四维查表形式存储，可直接驱动任务剖面下的效率与结温迭代，无需为每个工作点重新仿真。
    {% else %}
      <b>This is what a loss model consumes.</b> E<sub>on</sub> and E<sub>off</sub> are stored as a four-dimensional lookup over (I, V<sub>DC</sub>, T<sub>j</sub>, R<sub>g</sub>), so a mission-profile efficiency and junction-temperature iteration runs directly off the table instead of re-simulating every operating point.
    {% endif %}
  </figcaption>
</figure>
