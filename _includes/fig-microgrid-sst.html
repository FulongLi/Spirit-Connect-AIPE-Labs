{%- assign zh = false -%}{%- if include.lang == 'zh' -%}{%- assign zh = true -%}{%- endif -%}
<figure class="db-figure">
  <span class="db-figure-title">{% if zh %}固态变压器 —— 微电网的功率路由器{% else %}The solid-state transformer as a power router{% endif %}</span>
  <svg viewBox="0 0 880 274" role="img" aria-label="{% if zh %}固态变压器三级结构，将中压交流电网与低压交流负载和直流母线连接起来{% else %}Three-stage solid-state transformer linking a medium-voltage AC grid to low-voltage AC loads and a DC bus{% endif %}">
      <rect class="fig-block-soft" x="248" y="60" width="384" height="200" rx="10"/>
      <text class="fig-series" x="440" y="84" text-anchor="middle" fill="var(--fig-ink)">{% if zh %}固态变压器{% else %}Solid-state transformer{% endif %}</text>
      <rect class="fig-block" x="286" y="123" width="72" height="54" rx="3"/>
      <path class="fig-sym-thin" d="M286,177 L358,123"/>
      <path class="fig-sym-thin" d="M290,133 q3.5,-6 7,0 q3.5,6 7,0"/>
      <path class="fig-sym-thin" d="M340,166 h13 M340,170 h2.6 M345.2,170 h2.6 M350.4,170 h2.6"/>
      <text class="fig-note" x="322" y="196" text-anchor="middle">{% if zh %}中压前级{% else %}MV front end{% endif %}</text>
      <rect class="fig-block" x="404" y="123" width="72" height="54" rx="3"/>
      <path class="fig-sym-thin" d="M404,177 L476,123"/>
      <path class="fig-sym-thin" d="M408,133 h13 M408,137 h2.6 M413.2,137 h2.6 M418.4,137 h2.6"/>
      <path class="fig-sym-thin" d="M458,166 h13 M458,170 h2.6 M463.2,170 h2.6 M468.4,170 h2.6"/>
      <text class="fig-note" x="440" y="196" text-anchor="middle">{% if zh %}高频隔离{% else %}isolated, HF{% endif %}</text>
      <rect class="fig-block" x="522" y="123" width="72" height="54" rx="3"/>
      <path class="fig-sym-thin" d="M522,177 L594,123"/>
      <path class="fig-sym-thin" d="M526,133 h13 M526,137 h2.6 M531.2,137 h2.6 M536.4,137 h2.6"/>
      <path class="fig-sym-thin" d="M576,166 q3.5,-6 7,0 q3.5,6 7,0"/>
      <text class="fig-note" x="558" y="196" text-anchor="middle">{% if zh %}低压输出{% else %}LV output{% endif %}</text>
      <path class="fig-sym" d="M358,150 L404,150"/>
      <path class="fig-sym-fill" d="M404.0,150.0 L397.9,153.5 L397.9,146.5 z"/>
      <path class="fig-sym-fill" d="M358.0,150.0 L364.1,146.5 L364.1,153.5 z"/>
      <path class="fig-sym" d="M476,150 L522,150"/>
      <path class="fig-sym-fill" d="M522.0,150.0 L515.9,153.5 L515.9,146.5 z"/>
      <path class="fig-sym-fill" d="M476.0,150.0 L482.1,146.5 L482.1,153.5 z"/>
      <text class="fig-note" x="381" y="138" text-anchor="middle">{% if zh %}直流环节{% else %}DC link{% endif %}</text>
      <text class="fig-note" x="499" y="138" text-anchor="middle">{% if zh %}直流环节{% else %}DC link{% endif %}</text>
      <rect class="fig-block" x="50" y="133" width="140" height="34" rx="4"/>
      <text class="fig-note" x="120" y="153.5" text-anchor="middle" font-size="10">{% if zh %}中压交流电网{% else %}MV AC grid{% endif %}</text>
      <path class="fig-sym" d="M190,150 L245,150"/>
      <path class="fig-sym-fill" d="M245.0,150.0 L238.9,153.5 L238.9,146.5 z"/>
      <path class="fig-sym-fill" d="M190.0,150.0 L196.1,146.5 L196.1,153.5 z"/>
      <rect class="fig-block" x="685" y="80" width="150" height="32" rx="4"/>
      <text class="fig-note" x="760" y="99.5" text-anchor="middle" font-size="10">{% if zh %}低压交流负载{% else %}LV AC loads{% endif %}</text>
      <path class="fig-sym" d="M635,150 L672,150 L672,96"/>
      <path class="fig-sym" d="M672,96 L683,96"/>
      <path class="fig-sym-fill" d="M683.0,96.0 L676.9,99.5 L676.9,92.5 z"/>
      <path class="fig-sym-fill" d="M672.0,96.0 L678.1,92.5 L678.1,99.5 z"/>
      <rect class="fig-block" x="685" y="200" width="150" height="32" rx="4"/>
      <text class="fig-note" x="760" y="219.5" text-anchor="middle" font-size="10">{% if zh %}直流母线与储能{% else %}DC bus / storage{% endif %}</text>
      <path class="fig-sym" d="M672,150 L672,216"/>
      <path class="fig-sym" d="M672,216 L683,216"/>
      <path class="fig-sym-fill" d="M683.0,216.0 L676.9,219.5 L676.9,212.5 z"/>
      <path class="fig-sym-fill" d="M672.0,216.0 L678.1,212.5 L678.1,219.5 z"/>
      <circle class="fig-sym-fill" cx="672" cy="150" r="3.5"/>
      <path class="fig-guide" d="M440,181 V216 H672"/>
      <circle class="fig-sym-fill" cx="672" cy="216" r="3.5"/>
      <text class="fig-note" x="534" y="234" text-anchor="middle">{% if zh %}直流端口取自中间环节{% else %}DC port straight off the link{% endif %}</text>
  </svg>
  <figcaption>
    {% if zh %}
      <b>一台设备，多个端口，功率流向可控。</b>工频变压器只能按匝比被动变压；SST 的三级结构则同时提供中压接入、
      高频隔离与低压输出，并且中间直流环节天然就是一个直流端口 —— 光伏与储能可以直接挂上去，省掉整整一级变换。
      从微电网的角度看，它不是一台变压器，而是一个可以决定功率去向的路由节点。
    {% else %}
      <b>One device, several ports, and control over which way power goes.</b> A line-frequency transformer changes voltage
      passively by turns ratio and does nothing else. The three stages of an SST give medium-voltage connection, high-frequency
      isolation and low-voltage output — and the middle DC link is already a DC port, so PV and storage can hang off it
      directly and skip an entire conversion stage. From the microgrid's point of view it is not a transformer at all;
      it is a routing node that decides where power goes.
    {% endif %}
  </figcaption>
</figure>
