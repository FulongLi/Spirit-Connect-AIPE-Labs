{%- assign zh = false -%}{%- if include.lang == 'zh' -%}{%- assign zh = true -%}{%- endif -%}
<figure class="db-figure">
  <span class="db-figure-title">{% if zh %}结电容与偏置电压{% else %}Junction capacitance vs. bias{% endif %}</span>
  <svg viewBox="0 0 440 268" role="img" aria-label="{% if zh %}输入、输出与反向传输电容随漏源电压的变化{% else %}Input, output and reverse-transfer capacitance versus drain-source voltage{% endif %}">
    <g class="fig-grid">
      <line x1="147" y1="26" x2="147" y2="228"/>
      <line x1="228" y1="26" x2="228" y2="228"/>
      <line x1="309" y1="26" x2="309" y2="228"/>
      <line x1="66" y1="178" x2="390" y2="178"/>
      <line x1="66" y1="128" x2="390" y2="128"/>
      <line x1="66" y1="78" x2="390" y2="78"/>
      <line x1="66" y1="28" x2="390" y2="28"/>
    </g>
    <path class="fig-axis" d="M66,26 V228 H392"/>
    <g class="fig-tick" text-anchor="middle">
      <text x="66" y="244">0</text>
      <text x="147" y="244">200</text>
      <text x="228" y="244">400</text>
      <text x="309" y="244">600</text>
      <text x="390" y="244">800</text>
    </g>
    <g class="fig-tick" text-anchor="end">
      <text x="58" y="232">1 pF</text>
      <text x="58" y="182">10 pF</text>
      <text x="58" y="132">100 pF</text>
      <text x="58" y="82">1 nF</text>
      <text x="58" y="32">10 nF</text>
    </g>
    <text class="fig-axis-label" x="228" y="262" text-anchor="middle">V<tspan dy="3" font-size="8">DS</tspan><tspan dy="-3"> (V)</tspan></text>
    <text class="fig-axis-label" x="18" y="127" text-anchor="middle" transform="rotate(-90 18 127)">C {% if zh %}（对数）{% else %}(log){% endif %}</text>
    <path class="fig-line" stroke="var(--fig-1)" d="M66,46 C76,50 84,57 100,59 C160,62 280,63 390,64"/>
    <path class="fig-line" stroke="var(--fig-2)" d="M66,38 C73,62 80,92 94,108 C116,126 170,131 240,133 C300,135 345,136 390,136"/>
    <path class="fig-line" stroke="var(--fig-3)" d="M66,50 C72,78 78,122 92,146 C112,172 160,180 230,183 C290,185 340,186 390,187"/>
    <g class="fig-series">
      <text x="318" y="56" fill="var(--fig-1)">C<tspan dy="3" font-size="8">iss</tspan></text>
      <text x="318" y="128" fill="var(--fig-2)">C<tspan dy="3" font-size="8">oss</tspan></text>
      <text x="318" y="179" fill="var(--fig-3)">C<tspan dy="3" font-size="8">rss</tspan></text>
    </g>
    <line class="fig-guide" x1="228" y1="133" x2="228" y2="228"/>
    <text class="fig-note" x="234" y="222">Q<tspan dy="3" font-size="8">oss</tspan><tspan dy="-3"> / E</tspan><tspan dy="3" font-size="8">oss</tspan><tspan dy="-3"> {% if zh %}积分至{% else %}integrated to{% endif %} V</tspan><tspan dy="3" font-size="8">DC</tspan></text>
  </svg>
  <figcaption>
    {% if zh %}
      <b>用途：</b>C<sub>oss</sub>(V) 曲线经积分得到 Q<sub>oss</sub> 与 E<sub>oss</sub>，用于谐振换流、ZVS 死区时间与零电压开关可行性判断；C<sub>rss</sub> 决定 dv/dt 抗扰与串扰裕度。
    {% else %}
      <b>Why it is stored as a curve:</b> integrating C<sub>oss</sub>(V) gives Q<sub>oss</sub> and E<sub>oss</sub>, which set resonant commutation time, ZVS dead-time and whether zero-voltage switching closes at all. C<sub>rss</sub> sets dv/dt immunity and cross-talk margin.
    {% endif %}
  </figcaption>
</figure>
