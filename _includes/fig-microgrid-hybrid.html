  <figcaption>
    {% if zh %}
      <b>让每个元件待在它本来就属于的那一侧。</b>光伏、电池与直流快充天生是直流的，电机、变压器与既有配电天生是交流的 ——
      混合架构不再为迁就单一母线而付出多余的变换级。代价集中在一处：互联变流器。
      它必须在两个子网之间分配功率、维持各自的下垂特性，并在故障或孤岛时决定哪一侧先失去支撑。
    {% else %}
      <b>Let each element sit on the bus it natively belongs to.</b> PV, batteries and DC fast charging are DC by nature;
      motors, transformers and existing distribution are AC by nature — so a hybrid architecture stops paying conversion
      stages just to force everything onto one bus. The whole cost concentrates in one place: the interlinking converter.
      It has to share power between the two sub-grids, hold each one's droop characteristic, and decide which side loses
      support first during a fault or an island.
    {% endif %}
  </figcaption>
</figure>
