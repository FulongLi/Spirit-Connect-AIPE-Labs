  <figcaption>
    {% if zh %}
      <b>变换级数更少，且无需同步。</b>所有电源与负载汇聚于同一条直流母线，因此没有频率、没有相角、没有无功需要管理 ——
      母线电压本身就携带了功率平衡信息，这正是直流下垂控制如此简洁的原因。难点转移到了别处：
      直流故障电流没有自然过零点，开断困难；以及恒功率负载的负增量阻抗会主动对抗电源侧滤波器，母线稳定性需要专门设计。
    {% else %}
      <b>Fewer conversions, and nothing to synchronise.</b> Every source and load meets on one DC bus, so there is no
      frequency, no phase angle and no reactive power to manage — bus voltage alone carries the power-balance
      information, which is what makes DC droop control so simple. The hard parts move elsewhere: interrupting DC
      fault current with no natural zero crossing, and keeping the bus stable against constant-power loads, whose
      negative incremental impedance actively works against the source filters.
    {% endif %}
  </figcaption>
