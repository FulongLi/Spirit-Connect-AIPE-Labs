{%- assign zh = false -%}{%- if include.lang == 'zh' -%}{%- assign zh = true -%}{%- endif -%}
<figure class="db-figure">
  <span class="db-figure-title">{% if zh %}瞬态热阻抗{% else %}Transient thermal impedance{% endif %}</span>
  <svg viewBox="0 0 440 268" role="img" aria-label="{% if zh %}结到壳瞬态热阻抗随脉宽的双对数曲线{% else %}Junction-to-case transient thermal impedance versus pulse width, log-log{% endif %}">
    <g class="fig-grid">
      <line x1="131" y1="26" x2="131" y2="228"/>
      <line x1="196" y1="26" x2="196" y2="228"/>
      <line x1="262" y1="26" x2="262" y2="228"/>
      <line x1="327" y1="26" x2="327" y2="228"/>
      <line x1="66" y1="161" x2="392" y2="161"/>
      <line x1="66" y1="95" x2="392" y2="95"/>
      <line x1="66" y1="28" x2="392" y2="28"/>
    </g>
    <path class="fig-axis" d="M66,26 V228 H392"/>
    <g class="fig-tick" text-anchor="middle">
      <text x="66" y="244">1 µs</text>
      <text x="131" y="244">10 µs</text>
      <text x="196" y="244">100 µs</text>
      <text x="262" y="244">1 ms</text>
      <text x="327" y="244">10 ms</text>
      <text x="392" y="244">100 ms</text>
    </g>
    <g class="fig-tick" text-anchor="end">
      <text x="58" y="232">0.001</text>
      <text x="58" y="165">0.01</text>
      <text x="58" y="99">0.1</text>
      <text x="58" y="32">1</text>
    </g>
    <text class="fig-axis-label" x="229" y="262" text-anchor="middle">{% if zh %}脉宽 t{% else %}pulse width t{% endif %}<tspan dy="3" font-size="8">p</tspan></text>
    <text class="fig-axis-label" x="18" y="127" text-anchor="middle" transform="rotate(-90 18 127)">Z<tspan dy="3" font-size="8">th(j-c)</tspan><tspan dy="-3"> (K/W)</tspan></text>
    <line class="fig-guide" x1="66" y1="52" x2="392" y2="52"/>
    <text class="fig-note" x="388" y="46" text-anchor="end">R<tspan dy="3" font-size="8">th(j-c)</tspan></text>
    <path class="fig-line" stroke="var(--fig-1)" d="M66,214 C120,180 170,142 215,108 C258,76 320,56 392,52"/>
    <path class="fig-line fig-dash" stroke="var(--fig-2)" d="M66,196 C120,162 170,126 215,96 C258,70 320,54 392,50"/>
    <g transform="translate(84,40)">
      <line class="fig-line-thin" stroke="var(--fig-1)" x1="0" y1="0" x2="22" y2="0"/>
      <text class="fig-note" x="30" y="4">{% if zh %}单脉冲{% else %}single pulse{% endif %}</text>
      <line class="fig-line-thin fig-dash" stroke="var(--fig-2)" x1="0" y1="18" x2="22" y2="18"/>
      <text class="fig-note" x="30" y="22">{% if zh %}占空比 D = 0.2{% else %}duty D = 0.2{% endif %}</text>
    </g>
  </svg>
  <figcaption>
    {% if zh %}
      <b>以 Foster / Cauer 网络形式存储。</b>每个封装给出 R–C 阶梯参数而非单一 R<sub>th</sub>，可直接接入电-热联合仿真，在任务剖面下逐周期求解结温波动 ΔT<sub>j</sub>——寿命模型需要的正是 ΔT<sub>j</sub>。
    {% else %}
      <b>Stored as a Foster/Cauer network, not a single number.</b> Each package carries R–C ladder parameters that drop straight into an electro-thermal co-simulation, so junction-temperature swing ΔT<sub>j</sub> can be solved cycle by cycle over a mission profile — and ΔT<sub>j</sub> is exactly what a lifetime model needs.
    {% endif %}
  </figcaption>
</figure>
