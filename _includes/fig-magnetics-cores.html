{%- assign zh = false -%}{%- if include.lang == 'zh' -%}{%- assign zh = true -%}{%- endif -%}
<figure class="db-figure">
  <span class="db-figure-title">{% if zh %}收录的磁件形态{% else %}Part shapes covered{% endif %}</span>
  <svg viewBox="0 0 880 300" role="img" aria-label="{% if zh %}带气隙的 E 型磁芯、环形磁芯与平面磁芯加 PCB 绕组的示意图{% else %}Gapped E-core with bobbin windings, wound toroid, and planar core with a PCB winding stack{% endif %}">

    <!-- ── E / ER / PQ core ── -->
    <g>
      <path class="fig-outline" fill-rule="evenodd"
            d="M60,70 H270 V220 H60 Z M95,100 H150 V190 H95 Z M180,100 H235 V190 H180 Z"/>
      <rect class="fig-copper" x="118" y="104" width="30" height="82" rx="3"/>
      <rect class="fig-copper" x="182" y="104" width="30" height="82" rx="3"/>
      <g stroke="var(--fig-bg)" stroke-width="1.6" opacity=".55">
        <line x1="118" y1="118" x2="148" y2="118"/><line x1="118" y1="132" x2="148" y2="132"/>
        <line x1="118" y1="146" x2="148" y2="146"/><line x1="118" y1="160" x2="148" y2="160"/>
        <line x1="118" y1="174" x2="148" y2="174"/>
        <line x1="182" y1="118" x2="212" y2="118"/><line x1="182" y1="132" x2="212" y2="132"/>
        <line x1="182" y1="146" x2="212" y2="146"/><line x1="182" y1="160" x2="212" y2="160"/>
        <line x1="182" y1="174" x2="212" y2="174"/>
      </g>
      <rect fill="var(--fig-bg)" stroke="var(--fig-ink)" stroke-width="1.2" x="150" y="140" width="30" height="7"/>
      <g class="fig-guide"><line x1="165" y1="147" x2="165" y2="205"/></g>
      <text class="fig-note" x="165" y="216" text-anchor="middle">{% if zh %}中柱气隙 ℓ{% else %}centre-leg gap ℓ{% endif %}<tspan dy="3" font-size="8">g</tspan></text>
      <text class="fig-series" x="165" y="250" text-anchor="middle" fill="var(--fig-ink)">{% if zh %}E / ER / PQ / RM 磁芯{% else %}E / ER / PQ / RM core{% endif %}</text>
      <text class="fig-note" x="165" y="270" text-anchor="middle">{% if zh %}骨架绕组 · A{% else %}bobbin winding · A{% endif %}<tspan dy="3" font-size="8">e</tspan><tspan dy="-3">, ℓ</tspan><tspan dy="3" font-size="8">e</tspan><tspan dy="-3">, A</tspan><tspan dy="3" font-size="8">w</tspan></text>
    </g>

    <!-- ── toroid ── -->
    <g>
      <circle class="fig-outline" cx="450" cy="150" r="80"/>
      <circle class="fig-cut" cx="450" cy="150" r="44"/>
      <g class="fig-copper-stroke">
        <line x1="413.2" y1="134.4" x2="382.9" y2="99.4"/>
        <line x1="417.9" y1="126.1" x2="396.8" y2="85.0"/>
        <line x1="424.5" y1="119.2" x2="413.6" y2="74.3"/>
        <line x1="432.5" y1="114.0" x2="432.5" y2="67.8"/>
        <line x1="441.5" y1="110.9" x2="452.4" y2="66.0"/>
        <line x1="450.9" y1="110.0" x2="472.2" y2="69.0"/>
        <line x1="460.4" y1="111.4" x2="490.7" y2="76.5"/>
        <line x1="469.2" y1="114.9" x2="506.9" y2="88.2"/>
        <line x1="476.9" y1="120.4" x2="519.9" y2="103.4"/>
        <line x1="483.2" y1="127.6" x2="528.9" y2="121.3"/>
        <line x1="487.5" y1="136.1" x2="533.5" y2="140.7"/>
        <line x1="489.7" y1="145.4" x2="533.3" y2="160.7"/>
        <line x1="489.7" y1="154.9" x2="528.4" y2="180.1"/>
        <line x1="487.4" y1="164.1" x2="519.1" y2="197.8"/>
        <line x1="483.0" y1="172.6" x2="505.8" y2="212.8"/>
        <line x1="476.8" y1="179.7" x2="489.4" y2="224.2"/>
      </g>
      <text class="fig-series" x="450" y="250" text-anchor="middle" fill="var(--fig-ink)">{% if zh %}环形 / 分布气隙磁芯{% else %}Toroid / distributed gap{% endif %}</text>
      <text class="fig-note" x="450" y="270" text-anchor="middle">{% if zh %}铁硅铝、高磁通、MPP、纳米晶{% else %}sendust, high-flux, MPP, nanocrystalline{% endif %}</text>
    </g>

    <!-- ── planar core + PCB winding ── -->
    <g>
      <path class="fig-outline" d="M630,78 H830 V106 H802 V140 H758 V106 H702 V140 H658 V106 H630 Z"/>
      <path class="fig-outline" d="M630,222 H830 V194 H802 V160 H758 V194 H702 V160 H658 V194 H630 Z"/>
      <g>
        <rect class="fig-outline" x="614" y="140" width="88" height="20" rx="2"/>
        <rect class="fig-outline" x="758" y="140" width="88" height="20" rx="2"/>
        <g class="fig-copper">
          <rect x="618" y="142.5" width="80" height="3.4"/><rect x="618" y="148.3" width="80" height="3.4"/>
          <rect x="618" y="154.1" width="80" height="3.4"/>
          <rect x="762" y="142.5" width="80" height="3.4"/><rect x="762" y="148.3" width="80" height="3.4"/>
          <rect x="762" y="154.1" width="80" height="3.4"/>
        </g>
      </g>
      <text class="fig-series" x="730" y="250" text-anchor="middle" fill="var(--fig-ink)">{% if zh %}平面 / ELP 磁芯{% else %}Planar / ELP core{% endif %}</text>
      <text class="fig-note" x="730" y="270" text-anchor="middle">{% if zh %}PCB 绕组叠层 · 交错结构{% else %}PCB winding stack · interleaved{% endif %}</text>
    </g>
  </svg>
  <figcaption>
    {% if zh %}
      <b>每条记录 = 几何 + 材料 + 绕组。</b>磁芯给出 A<sub>e</sub>、ℓ<sub>e</sub>、V<sub>e</sub>、绕组窗口面积与平均匝长；材料给出 B–H 环、饱和磁密与温度相关损耗；绕组给出导体类型、匝数、层数与交错方式。三者齐备，自动化磁件设计才能闭环。
    {% else %}
      <b>One record = geometry + material + winding.</b> The core contributes A<sub>e</sub>, ℓ<sub>e</sub>, V<sub>e</sub>, window area and mean turn length; the material contributes B–H loops, saturation flux density and temperature-dependent loss; the winding contributes conductor type, turns, layers and interleaving. Automated magnetics sizing closes only when all three are present.
    {% endif %}
  </figcaption>
</figure>
