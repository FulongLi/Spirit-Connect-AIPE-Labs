# Supabase configuration for local development (`supabase start`) of the
# newsletter backend; see docs/community/setup.md. Secrets are read from the
# environment, never committed.

project_id = "aipe-labs"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
# No member accounts: the site has no sign-in.
enabled = true
site_url = "http://localhost:4000"
enable_signup = false

[functions.newsletter-subscribe]
# Public endpoint: anonymous visitors subscribe without an account.
verify_jwt = false
