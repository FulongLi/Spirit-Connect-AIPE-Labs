<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 375" role="img" aria-label="Double-ended excitation: the negative pulse resets the positive pulse">
<title>Double-ended excitation: the negative pulse resets the positive pulse</title>
<rect width="900" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#175d85"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#202b35">
<text x="30.00" y="35.00" font-size="23" text-anchor="start" fill="#202b35" font-weight="bold">Double-ended excitation: the negative pulse resets the positive pulse</text>
<text x="30.00" y="101.00" font-size="18" text-anchor="start" fill="#202b35" font-weight="bold">Full bridge</text>
<line x1="120.00" y1="153.00" x2="850.00" y2="153.00" stroke="#e0e5e8" stroke-width="1"/>
<text x="108.00" y="158.00" font-size="16" text-anchor="end" fill="#202b35" font-weight="normal">-1</text>
<line x1="120.00" y1="115.50" x2="850.00" y2="115.50" stroke="#e0e5e8" stroke-width="1"/>
<text x="108.00" y="120.50" font-size="16" text-anchor="end" fill="#202b35" font-weight="normal">0</text>
<line x1="120.00" y1="78.00" x2="850.00" y2="78.00" stroke="#e0e5e8" stroke-width="1"/>
<text x="108.00" y="83.00" font-size="16" text-anchor="end" fill="#202b35" font-weight="normal">1</text>
<line x1="120.00" y1="78.00" x2="120.00" y2="153.00" stroke="#e0e5e8" stroke-width="1"/>
<line x1="302.50" y1="78.00" x2="302.50" y2="153.00" stroke="#e0e5e8" stroke-width="1"/>
<line x1="485.00" y1="78.00" x2="485.00" y2="153.00" stroke="#e0e5e8" stroke-width="1"/>
<line x1="667.50" y1="78.00" x2="667.50" y2="153.00" stroke="#e0e5e8" stroke-width="1"/>
<line x1="850.00" y1="78.00" x2="850.00" y2="153.00" stroke="#e0e5e8" stroke-width="1"/>
<polyline points="120.00,78.00 302.50,78.00 302.50,115.50 485.00,115.50 485.00,153.00 667.50,153.00 667.50,115.50 850.00,115.50" fill="none" stroke="#175d85" stroke-width="2.8" stroke-linejoin="round"/>
<text x="30.00" y="226.00" font-size="18" text-anchor="start" fill="#202b35" font-weight="bold">Half bridge</text>
<line x1="120.00" y1="278.00" x2="850.00" y2="278.00" stroke="#e0e5e8" stroke-width="1"/>
<text x="108.00" y="283.00" font-size="16" text-anchor="end" fill="#202b35" font-weight="normal">-0.5</text>
<line x1="120.00" y1="240.50" x2="850.00" y2="240.50" stroke="#e0e5e8" stroke-width="1"/>
<text x="108.00" y="245.50" font-size="16" text-anchor="end" fill="#202b35" font-weight="normal">0</text>
<line x1="120.00" y1="203.00" x2="850.00" y2="203.00" stroke="#e0e5e8" stroke-width="1"/>
<text x="108.00" y="208.00" font-size="16" text-anchor="end" fill="#202b35" font-weight="normal">0.5</text>
<line x1="120.00" y1="203.00" x2="120.00" y2="278.00" stroke="#e0e5e8" stroke-width="1"/>
<text x="120.00" y="304.00" font-size="16" text-anchor="middle" fill="#202b35" font-weight="normal">0</text>
<line x1="302.50" y1="203.00" x2="302.50" y2="278.00" stroke="#e0e5e8" stroke-width="1"/>
<text x="302.50" y="304.00" font-size="16" text-anchor="middle" fill="#202b35" font-weight="normal">D</text>
<line x1="485.00" y1="203.00" x2="485.00" y2="278.00" stroke="#e0e5e8" stroke-width="1"/>
<text x="485.00" y="304.00" font-size="16" text-anchor="middle" fill="#202b35" font-weight="normal">1/2</text>
<line x1="667.50" y1="203.00" x2="667.50" y2="278.00" stroke="#e0e5e8" stroke-width="1"/>
<text x="667.50" y="304.00" font-size="16" text-anchor="middle" fill="#202b35" font-weight="normal">1/2 + D</text>
<line x1="850.00" y1="203.00" x2="850.00" y2="278.00" stroke="#e0e5e8" stroke-width="1"/>
<text x="850.00" y="304.00" font-size="16" text-anchor="middle" fill="#202b35" font-weight="normal">t / Ts = 1</text>
<polyline points="120.00,203.00 302.50,203.00 302.50,240.50 485.00,240.50 485.00,278.00 667.50,278.00 667.50,240.50 850.00,240.50" fill="none" stroke="#175d85" stroke-width="2.8" stroke-linejoin="round"/>
<text x="30.00" y="333.00" font-size="17" text-anchor="start" fill="#687581" font-weight="normal">Winding voltage divided by Vg; ideal intervals, D = 0.25 per pulse. Equal areas prevent flux</text>
<text x="30.00" y="353.00" font-size="17" text-anchor="start" fill="#687581" font-weight="normal">drift.</text>
</g></svg>
