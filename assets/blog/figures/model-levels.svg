<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 455" role="img" aria-label="Choose a model for the question you are asking">
<title>Choose a model for the question you are asking</title>
<rect width="900" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#175d85"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#202b35">
<text x="30.00" y="35.00" font-size="23" text-anchor="start" fill="#202b35" font-weight="bold">Choose a model for the question you are asking</text>
<rect x="45" y="70" width="265" height="65" rx="6" fill="#edf4f8" stroke="#175d85"/>
<text x="177.50" y="108.50" font-size="20" text-anchor="middle" fill="#202b35" font-weight="bold">Switching model</text>
<text x="345.00" y="98.00" font-size="19" text-anchor="start" fill="#202b35" font-weight="normal">Resolve each on/off interval.</text>
<text x="345.00" y="122.00" font-size="17" text-anchor="start" fill="#687581" font-weight="normal">Use it for ripple, device stress and commutation.</text>
<line x1="177.00" y1="137.00" x2="177.00" y2="161.00" stroke="#175d85" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="165" width="265" height="65" rx="6" fill="#f7f8f9" stroke="#bac4cc"/>
<text x="177.50" y="203.50" font-size="20" text-anchor="middle" fill="#202b35" font-weight="bold">Averaged model</text>
<text x="345.00" y="193.00" font-size="19" text-anchor="start" fill="#202b35" font-weight="normal">Replace switching intervals by their weighted mean.</text>
<text x="345.00" y="217.00" font-size="17" text-anchor="start" fill="#687581" font-weight="normal">Retain large-signal energy storage and duty dependence.</text>
<line x1="177.00" y1="232.00" x2="177.00" y2="256.00" stroke="#175d85" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="260" width="265" height="65" rx="6" fill="#f7f8f9" stroke="#bac4cc"/>
<text x="177.50" y="298.50" font-size="20" text-anchor="middle" fill="#202b35" font-weight="bold">Small-signal model</text>
<text x="345.00" y="288.00" font-size="19" text-anchor="start" fill="#202b35" font-weight="normal">Perturb one equilibrium and keep first-order terms.</text>
<text x="345.00" y="312.00" font-size="17" text-anchor="start" fill="#687581" font-weight="normal">Use it for local loop gain and disturbance response.</text>
<text x="30.00" y="433.00" font-size="17" text-anchor="start" fill="#687581" font-weight="normal">Averaging removes fast ripple. Linearisation is a separate approximation.</text>
</g></svg>
