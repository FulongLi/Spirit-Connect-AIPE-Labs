<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 365" role="img" aria-label="Thermal resistance belongs to a specified heat path">
<title>Thermal resistance belongs to a specified heat path</title>
<rect width="900" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#175d85"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#202b35">
<text x="30.00" y="35.00" font-size="23" text-anchor="start" fill="#202b35" font-weight="bold">Thermal resistance belongs to a specified heat path</text>
<rect x="35" y="140" width="200" height="80" rx="6" fill="#edf4f8" stroke="#175d85"/>
<text x="135.00" y="175.00" font-size="20" text-anchor="middle" fill="#202b35" font-weight="bold">Junction</text>
<text x="135.00" y="199.00" font-size="17" text-anchor="middle" fill="#687581" font-weight="normal">Tj</text>
<rect x="320" y="140" width="200" height="80" rx="6" fill="#edf4f8" stroke="#175d85"/>
<text x="420.00" y="175.00" font-size="20" text-anchor="middle" fill="#202b35" font-weight="bold">Case</text>
<text x="420.00" y="199.00" font-size="17" text-anchor="middle" fill="#687581" font-weight="normal">Tc</text>
<rect x="615" y="140" width="200" height="80" rx="6" fill="#edf4f8" stroke="#175d85"/>
<text x="715.00" y="175.00" font-size="20" text-anchor="middle" fill="#202b35" font-weight="bold">Coolant</text>
<text x="715.00" y="199.00" font-size="17" text-anchor="middle" fill="#687581" font-weight="normal">Tf</text>
<line x1="245.00" y1="180.00" x2="307.00" y2="180.00" stroke="#175d85" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="275.00" y="125.00" font-size="18" text-anchor="middle" fill="#202b35" font-weight="normal">Rth,JC</text>
<line x1="530.00" y1="180.00" x2="592.00" y2="180.00" stroke="#175d85" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="560.00" y="125.00" font-size="18" text-anchor="middle" fill="#202b35" font-weight="normal">Rth,CF</text>
<text x="445.00" y="280.00" font-size="18" text-anchor="middle" fill="#202b35" font-weight="normal">Temperature drops add only when the same heat flow passes through the path.</text>
<text x="30.00" y="323.00" font-size="17" text-anchor="start" fill="#687581" font-weight="normal">Functional thermal path, not a universal package model. Parallel paths and boundary temperatures</text>
<text x="30.00" y="343.00" font-size="17" text-anchor="start" fill="#687581" font-weight="normal">matter.</text>
</g></svg>
