<text x="30.00" y="478.00" font-size="17" text-anchor="start" fill="#687581" font-weight="normal">Ideal example: L = 100 µH, VDD = 50 V, Vav = 100 V, I0 = 10 A. Avalanche integral = 10 mJ.</text>
