<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-label="Steady-state thermal resistance is a temperature-rise slope">
<title>Steady-state thermal resistance is a temperature-rise slope</title>
<rect width="900" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#175d85"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#202b35">
<text x="30.00" y="35.00" font-size="23" text-anchor="start" fill="#202b35" font-weight="bold">Steady-state thermal resistance is a temperature-rise slope</text>
<text x="30.00" y="86.00" font-size="18" text-anchor="start" fill="#202b35" font-weight="normal">Tj − Tref / K</text>
<line x1="100.00" y1="105.00" x2="100.00" y2="365.00" stroke="#e4e8eb" stroke-width="1"/>
<text x="100.00" y="392.00" font-size="17" text-anchor="middle" fill="#202b35" font-weight="normal">0</text>
<line x1="287.50" y1="105.00" x2="287.50" y2="365.00" stroke="#e4e8eb" stroke-width="1"/>
<text x="287.50" y="392.00" font-size="17" text-anchor="middle" fill="#202b35" font-weight="normal">10</text>
<line x1="475.00" y1="105.00" x2="475.00" y2="365.00" stroke="#e4e8eb" stroke-width="1"/>
<text x="475.00" y="392.00" font-size="17" text-anchor="middle" fill="#202b35" font-weight="normal">20</text>
<line x1="662.50" y1="105.00" x2="662.50" y2="365.00" stroke="#e4e8eb" stroke-width="1"/>
<text x="662.50" y="392.00" font-size="17" text-anchor="middle" fill="#202b35" font-weight="normal">30</text>
<line x1="850.00" y1="105.00" x2="850.00" y2="365.00" stroke="#e4e8eb" stroke-width="1"/>
<text x="850.00" y="392.00" font-size="17" text-anchor="middle" fill="#202b35" font-weight="normal">40</text>
<line x1="100.00" y1="365.00" x2="850.00" y2="365.00" stroke="#e4e8eb" stroke-width="1"/>
<text x="87.00" y="371.00" font-size="17" text-anchor="end" fill="#202b35" font-weight="normal">0</text>
<line x1="100.00" y1="300.00" x2="850.00" y2="300.00" stroke="#e4e8eb" stroke-width="1"/>
<text x="87.00" y="306.00" font-size="17" text-anchor="end" fill="#202b35" font-weight="normal">15</text>
<line x1="100.00" y1="235.00" x2="850.00" y2="235.00" stroke="#e4e8eb" stroke-width="1"/>
<text x="87.00" y="241.00" font-size="17" text-anchor="end" fill="#202b35" font-weight="normal">30</text>
<line x1="100.00" y1="170.00" x2="850.00" y2="170.00" stroke="#e4e8eb" stroke-width="1"/>
<text x="87.00" y="176.00" font-size="17" text-anchor="end" fill="#202b35" font-weight="normal">45</text>
<line x1="100.00" y1="105.00" x2="850.00" y2="105.00" stroke="#e4e8eb" stroke-width="1"/>
<text x="87.00" y="111.00" font-size="17" text-anchor="end" fill="#202b35" font-weight="normal">60</text>
<line x1="100.00" y1="105.00" x2="100.00" y2="365.00" stroke="#202b35" stroke-width="1.6"/>
<line x1="100.00" y1="365.00" x2="850.00" y2="365.00" stroke="#202b35" stroke-width="1.6"/>
<polyline points="100.00,365.00 850.00,105.00" fill="none" stroke="#175d85" stroke-width="2.8" stroke-linejoin="round"/>
<line x1="340.00" y1="77.00" x2="366.00" y2="77.00" stroke="#175d85" stroke-width="2.8"/>
<text x="373.00" y="83.00" font-size="17" text-anchor="start" fill="#202b35" font-weight="normal">Rth = 1.5 K/W</text>
<text x="475.00" y="426.00" font-size="18" text-anchor="middle" fill="#202b35" font-weight="normal">Dissipated power along the defined path / W</text>
<text x="30.00" y="438.00" font-size="17" text-anchor="start" fill="#687581" font-weight="normal">Synthetic linear example: 30 W produces 45 K rise. Real measurements need mounting and</text>
<text x="30.00" y="458.00" font-size="17" text-anchor="start" fill="#687581" font-weight="normal">uncertainty records.</text>
</g></svg>
