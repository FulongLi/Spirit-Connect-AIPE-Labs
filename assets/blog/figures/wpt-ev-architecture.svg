<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="Ground assembly, vehicle assembly, and the checks between them">
<title>Ground assembly, vehicle assembly, and the checks between them</title>
<rect width="900" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#175d85"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#202b35">
<text x="30.00" y="35.00" font-size="23" text-anchor="start" fill="#202b35" font-weight="bold">Ground assembly, vehicle assembly, and the checks between them</text>
<rect x="40" y="90" width="205" height="88" rx="6" fill="#f7f8f9" stroke="#bac4cc"/>
<text x="142.50" y="129.00" font-size="20" text-anchor="middle" fill="#202b35" font-weight="bold">Grid input</text>
<text x="142.50" y="153.00" font-size="17" text-anchor="middle" fill="#687581" font-weight="normal">PFC front end</text>
<rect x="300" y="90" width="205" height="88" rx="6" fill="#edf4f8" stroke="#175d85"/>
<text x="402.50" y="129.00" font-size="20" text-anchor="middle" fill="#202b35" font-weight="bold">HF inverter</text>
<text x="402.50" y="153.00" font-size="17" text-anchor="middle" fill="#687581" font-weight="normal">85 kHz band</text>
<rect x="560" y="90" width="205" height="88" rx="6" fill="#edf4f8" stroke="#175d85"/>
<text x="662.50" y="129.00" font-size="20" text-anchor="middle" fill="#202b35" font-weight="bold">GA network</text>
<text x="662.50" y="153.00" font-size="17" text-anchor="middle" fill="#687581" font-weight="normal">Compensation + pad</text>
<line x1="245.00" y1="134.00" x2="294.00" y2="134.00" stroke="#175d85" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="505.00" y1="134.00" x2="554.00" y2="134.00" stroke="#175d85" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="560" y="292" width="205" height="88" rx="6" fill="#edf4f8" stroke="#175d85"/>
<text x="662.50" y="331.00" font-size="20" text-anchor="middle" fill="#202b35" font-weight="bold">VA network</text>
<text x="662.50" y="355.00" font-size="17" text-anchor="middle" fill="#687581" font-weight="normal">Pad + compensation</text>
<rect x="300" y="292" width="205" height="88" rx="6" fill="#edf4f8" stroke="#175d85"/>
<text x="402.50" y="331.00" font-size="20" text-anchor="middle" fill="#202b35" font-weight="bold">Rectifier</text>
<text x="402.50" y="355.00" font-size="17" text-anchor="middle" fill="#687581" font-weight="normal">Optional DC–DC</text>
<rect x="40" y="292" width="205" height="88" rx="6" fill="#f7f8f9" stroke="#bac4cc"/>
<text x="142.50" y="331.00" font-size="20" text-anchor="middle" fill="#202b35" font-weight="bold">Battery</text>
<text x="142.50" y="355.00" font-size="17" text-anchor="middle" fill="#687581" font-weight="normal">BMS limits</text>
<line x1="554.00" y1="336.00" x2="505.00" y2="336.00" stroke="#175d85" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="294.00" y1="336.00" x2="245.00" y2="336.00" stroke="#175d85" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="662.00" y1="182.00" x2="662.00" y2="288.00" stroke="#175d85" stroke-width="3" marker-end="url(#arrow)"/>
<text x="690.00" y="240.00" font-size="18" text-anchor="start" fill="#202b35" font-weight="normal">Air gap 100–250 mm</text>
<text x="690.00" y="264.00" font-size="17" text-anchor="start" fill="#687581" font-weight="normal">k roughly 0.1–0.3</text>
<rect x="60" y="196" width="420" height="78" rx="6" fill="#f3f6f8" stroke="#c4cdd4"/>
<text x="270.00" y="224.00" font-size="19" text-anchor="middle" fill="#202b35" font-weight="bold">Object and living-object detection</text>
<text x="270.00" y="250.00" font-size="17" text-anchor="middle" fill="#687581" font-weight="normal">Runs before and during transfer, on the ground side</text>
<text x="30.00" y="428.00" font-size="17" text-anchor="start" fill="#687581" font-weight="normal">Functional layout for unidirectional charging. Bidirectional hardware reverses the arrows;</text>
<text x="30.00" y="448.00" font-size="17" text-anchor="start" fill="#687581" font-weight="normal">alignment, communication and safety interlocks are not optional additions.</text>
</g></svg>
