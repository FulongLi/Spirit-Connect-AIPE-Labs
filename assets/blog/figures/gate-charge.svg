<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-label="Gate charge: the plateau consumes charge while drain voltage changes">
<title>Gate charge: the plateau consumes charge while drain voltage changes</title>
<rect width="900" height="100%" fill="white"/>
