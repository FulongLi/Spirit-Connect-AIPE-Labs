<text x="550.00" y="392.00" font-size="17" text-anchor="middle" fill="#202b35" font-weight="normal">18</text>
<line x1="850.00" y1="105.00" x2="850.00" y2="365.00" stroke="#e4e8eb" stroke-width="1"/>
<text x="850.00" y="392.00" font-size="17" text-anchor="middle" fill="#202b35" font-weight="normal">30</text>
