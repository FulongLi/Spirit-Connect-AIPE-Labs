<text x="373.00" y="83.00" font-size="17" text-anchor="start" fill="#202b35" font-weight="normal">Illustrative</text>
<text x="475.00" y="426.00" font-size="18" text-anchor="middle" fill="#202b35" font-weight="normal">Accumulated gate charge / nC</text>
<text x="30.00" y="438.00" font-size="17" text-anchor="start" fill="#687581" font-weight="normal">Here the plateau spans 12 nC. Its voltage and duration depend on current, bus voltage and the</text>
