# Site navigation — one source of truth for the English and Chinese navbar and
# footer, so the two languages cannot drift apart.
#
# URLs here are language-neutral. _includes/navbar.html and _includes/footer.html
# prefix /zh for the Chinese site, so every entry must exist in both languages.
#
# `source: domains` pulls the menu items from _data/domains.yml instead of
# repeating the four engineering domains here.
#
# Navigation is deliberately short. A page not listed here is still reachable —
# from /resources/, from the homepage, or from the footer.

header:
  - id: engineering
    source: domains
    en: Engineering
    zh: 电力工程

  - id: resources
    en: Resources
    zh: 资源
    items:
      - url: /resources/
        en: All resources
        zh: 资源总览
      - url: /resources/databases/
        en: Databases
        zh: 数据库
      - url: /resources/design-references/
        en: Design References
        zh: 设计参考
      - url: /resources/blog/
        en: Engineering Notes
        zh: 工程笔记

  - id: agents
    url: /plugin/
    class: nav-plugin
    en: For coding agents
    zh: 面向 Coding Agent

footer:
  - id: platform
    en: Platform
    zh: 平台
    items:
      - url: /resources/
        en: All resources
        zh: 资源总览
      - url: /resources/databases/
        en: Databases
        zh: 数据库
      - url: /resources/design-references/
        en: Design References
        zh: 设计参考
      - url: /resources/blog/
        en: Engineering Notes
        zh: 工程笔记
      - url: /plugin/
        en: For coding agents
        zh: 面向 Coding Agent

  - id: engineering
    source: domains
    en: Engineering
    zh: 电力工程

  - id: company
    en: Company
    zh: 公司
    items:
      - url: /company/about/
        en: About
        zh: 关于我们
      - url: /company/team/
        en: Team
        zh: 团队
      - url: /company/faq/
        en: FAQ
        zh: 常见问题
      - url: /company/careers/
        en: Careers
        zh: 招聘
      - url: /news/
        en: News
        zh: 新闻


