# UI chrome strings for both languages.
#
# Scope: short strings that appear inside shared includes, where the markup is
# written once and rendered for both languages. Referenced as
#   {% assign t = site.data.i18n[page.lang | default: 'en'] %}
#
# Navigation labels are NOT here — they live with their links in
# _data/navigation.yml, and engineering domain labels in _data/domains.yml, so
# a link and its label can never drift apart. Page body copy stays in the page.

en:
  # chrome
  nav_contact: "Contact Us"
  lang_label: "EN"
  lang_english: "English"
  lang_chinese: "中文"
  # shared includes
  partners_heading: "Partners &amp; collaborations"
  partners_aria: "Partners and collaborators"
  none_published: "Nothing is published in this layer yet. The structure is in place so that new work can be listed here as it is released."
  repository_link: "Repository ↗"
  view_link: "View →"
  domains_label: "Domains"
  # footer
  footer_tagline: "Closing the AI–power design loop."
  footer_location: "Cardiff, United Kingdom"
  footer_rights: "© 2026 AIPE Labs，Spirit Connect Ltd. All rights reserved."

zh:
  # chrome
  nav_contact: "联系我们"
  lang_label: "中文"
  lang_english: "English"
  lang_chinese: "中文"
  # shared includes
  partners_heading: "合作伙伴"
  partners_aria: "合作伙伴与协作机构"
  none_published: "该层尚未发布内容。结构已经就位，新的成果发布后会列在这里。"
  repository_link: "代码仓库 ↗"
  view_link: "查看 →"
  domains_label: "工程领域"
  # footer
  footer_tagline: "连接 AI 与电力设计闭环。"
