# Site-owned resources for AIPE Academy knowledge-graph topics.
#
# From v0.2 the knowledge graph itself (_data/knowledge_graph.yml) is generated by
# tools/sync_ecosystem.py from AIPE Academy's generated/knowledge-graph.json:
# topics (module ids), subjects (domain ids), prerequisites, related topics and
# lesson attachments all come from the Academy. This file adds the website's own
# links per topic id: Hub tools, data pages, reference designs and articles.
# `localised: true` means the same path exists under /zh. tools/hub_data.py
# checks that every id exists in the generated graph and every URL resolves.
#
# Edit this file, then re-run the Academy sync to regenerate knowledge_graph.yml.

