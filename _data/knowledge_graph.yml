# AIPE Academy engineering knowledge graph (GENERATED; do not edit).
#
# Regenerated by tools/sync_ecosystem.py from the pinned AIPE Academy revision's
# generated/knowledge-graph.json: topics are Academy module ids, subjects are
# Academy domain ids (the Academy stages in _data/academy.yml), `requires` and
# `related` are the Academy's learning dependencies, `lessons` are the generated
# lesson URLs attached to each module and `status` is the Academy's coverage
# status (available, draft, outline or planned). `resources` are the website's
# own links from _data/knowledge_graph_resources.yml; edit that file, then
# re-run the sync. tools/hub_data.py validates labels, references and cycles.

nodes:
- id: f.learning-with-ai
  subject: foundations
  track: learning-methods
  title:
    en: Learning with AI
    zh: 与 AI 一起学习
  summary:
    en: 'Orientation to the field and the learning method: ask in ordinary language, predict, verify, record evidence of understanding.'
    zh: 领域入门与学习方法：用普通语言提问、预测、验证，并记录理解的证据。
  status: outline
  lessons:
  - /academy/foundations/orientation/
- id: f.quantities
  subject: foundations
  track: mathematics
  title:
    en: Quantities, units and algebra
    zh: 数量、单位与代数
  summary:
    en: 'Ratios, scientific notation, unit conversion and simple equations: the arithmetic every engineering estimate rests on.'
    zh: 比例、科学计数法、单位换算与简单方程：一切工程估算所依赖的基本运算。
  status: available
  lessons:
  - /academy/foundations/dc-circuit-fundamentals/
  - /academy/foundations/first-circuit-zh/
- id: f.calculus
  subject: foundations
  track: mathematics
  title:
    en: Calculus and differential equations
    zh: 微积分与微分方程
  summary:
    en: Slopes, areas, exponentials and first-order differential equations, introduced through charging and discharging circuits.
    zh: 斜率、面积、指数函数与一阶微分方程，通过充放电电路引入。
  status: planned
  requires:
  - f.quantities
  related:
  - f.dynamics
- id: f.linear-algebra
  subject: foundations
  track: mathematics
  title:
    en: Linear algebra and state space
    zh: 线性代数与状态空间
  summary:
    en: Systems of linear equations, matrices and state-space descriptions, introduced when node equations and dynamic models need them.
    zh: 线性方程组、矩阵与状态空间描述，在节点方程与动态模型需要时引入。
  status: planned
  requires:
  - f.quantities
  related:
  - f.computation
  - f.signals
- id: f.electromagnetism
  subject: foundations
  track: physics
  title:
    en: Electricity and magnetism
    zh: 电磁学
  summary:
    en: Charge, electric field and potential, current, magnetic fields, Faraday's law and energy stored in fields.
    zh: 电荷、电场与电势、电流、磁场、法拉第定律以及场中储存的能量。
  status: planned
  requires:
  - f.quantities
  - f.calculus
  related:
  - f.dc-circuits
  - f.magnetism
- id: f.dc-circuits
  subject: foundations
  track: circuits
  title:
    en: DC circuits
    zh: 直流电路
  summary:
    en: Voltage, current, power and energy; Ohm's law, KCL, KVL, series and parallel networks and equivalent circuits.
    zh: 电压、电流、功率与能量；欧姆定律、KCL、KVL、串并联网络与等效电路。
  status: available
  requires:
  - f.quantities
  related:
  - f.electromagnetism
  lessons:
  - /academy/foundations/dc-circuit-fundamentals/
  - /academy/foundations/first-circuit-zh/
- id: f.dynamics
  subject: foundations
  track: circuits
  title:
    en: Energy storage dynamics
    zh: 储能元件动态
  summary:
    en: Capacitors and inductors, first-order differential equations, RC and RL responses and time constants.
    zh: 电容与电感、一阶微分方程、RC 与 RL 响应以及时间常数。
  status: planned
  requires:
  - f.dc-circuits
  - f.calculus
- id: f.ac
  subject: foundations
  track: circuits
  title:
    en: Waveforms and AC
    zh: 周期波形与交流
  summary:
    en: Period, frequency, duty cycle, average and RMS values; complex numbers, phasors and impedance.
    zh: 周期、频率、占空比、平均值与有效值；复数、相量与阻抗。
  status: planned
  requires:
  - f.quantities
  - f.dynamics
- id: f.electronics
  subject: foundations
  track: electronics
  title:
    en: Basic electronic devices
    zh: 基础电子器件
  summary:
    en: Simplified models of diodes and MOSFETs, operating points, losses and ratings.
    zh: 二极管与 MOSFET 的简化模型、工作点、损耗与额定值。
  status: planned
  requires:
  - f.dc-circuits
  - f.dynamics
- id: f.signals
  subject: foundations
  track: signals-and-control
  title:
    en: Signals and feedback
    zh: 信号、系统与反馈
  summary:
    en: Linear time-invariant systems, step and frequency response, Laplace transforms, poles, Bode plots and negative feedback.
    zh: 线性时不变系统、阶跃与频率响应、拉普拉斯变换、极点、Bode 图与负反馈。
  status: planned
  requires:
  - f.dynamics
  - f.ac
  related:
  - f.linear-algebra
- id: f.computation
  subject: foundations
  track: computation
  title:
    en: Computation and numerics
    zh: 计算与数值方法
  summary:
    en: Scripts, plots and simulation models; numerical integration, step sizes and numerical error.
    zh: 脚本、绘图与仿真模型；数值积分、仿真步长与数值误差。
  status: planned
  requires:
  - f.quantities
  - f.dynamics
  related:
  - f.linear-algebra
- id: f.magnetism
  subject: foundations
  track: magnetism-and-measurement
  title:
    en: Magnetism and measurement
    zh: 磁学与工程测量
  summary:
    en: Flux, induction, magnetic circuits and saturation; measurement range, sampling, reference points and error.
    zh: 磁通、感应、磁路与饱和；测量量程、采样、参考点与误差。
  status: planned
  requires:
  - f.dynamics
  - f.electronics
  related:
  - f.electromagnetism
- id: pe.devices
  subject: power-electronics
  track: devices-and-components
  title:
    en: Power semiconductor devices
    zh: 功率半导体器件
  summary:
    en: Diodes, MOSFETs, IGBTs, SiC and GaN as switches; datasheets, parasitics and conduction loss.
    zh: 作为开关的二极管、MOSFET、IGBT、SiC 与 GaN 器件；数据手册、寄生参数与导通损耗。
  status: outline
  requires:
  - f.electronics
  related:
  - pe.losses
  lessons:
  - /academy/power-electronics/components/
  resources:
  - url: /database/transistors/
    localised: true
    label:
      en: Transistor data
      zh: 晶体管数据
  - url: /power/devices/
    localised: true
    label:
      en: Device articles
      zh: 器件文章
- id: pe.passives
  subject: power-electronics
  track: devices-and-components
  title:
    en: Passive and magnetic components
    zh: 无源与磁性元件
  summary:
    en: 'Capacitors and inductors as real components: ESR, ESL, ripple-current ratings, saturation and tolerance.'
    zh: 作为真实元件的电容与电感：ESR、ESL、纹波电流额定值、饱和与公差。
