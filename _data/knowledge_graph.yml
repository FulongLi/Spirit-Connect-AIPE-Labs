  requires:
  - f.dynamics
  - f.ac
  related:
  - pe.magnetics
  lessons:
  - /academy/power-electronics/components/
- id: pe.topologies
  subject: power-electronics
  track: dc-dc-conversion
  title:
    en: Converter fundamentals and topologies
    zh: 变换器基础与拓扑
  summary:
    en: 'Switching converters in steady state: volt-second and charge balance, conversion ratios, ripple, CCM and DCM.'
    zh: 稳态下的开关变换器：伏秒平衡与电荷平衡、变比、纹波、CCM 与 DCM。
  status: available
  requires:
  - pe.devices
  - f.ac
  lessons:
  - /academy/power-electronics/buck-converter-fundamentals/
  - /academy/power-electronics/converters/
  resources:
  - url: /power/converters/
    localised: true
    label:
      en: Converter articles
      zh: 变换器文章
  - url: /resources/ai-agent-team/aipe-sketch/
    localised: true
    label:
      en: Draw schematics with AIPE Sketch
      zh: 用 AIPE Sketch 绘制原理图
- id: pe.buck
