# AIPE Academy learning-path presentation.
#
# Lesson content, titles, language, status and durations are owned by AIPE
# Academy and arrive as generated pages in academy/*.md. This file only groups
# those lesson URLs into learning stages for the two Academy entry points:
#
#   /academy/     lists English lessons only (lesson front matter `lang: en`)
#   /zh/academy/  lists Chinese lessons only (`lang: zh`)
#
# A stage may hold lessons in either language; each entry point shows only the
# lessons in its own language and marks a stage without any as planned, never
# falling back to the other language. Stage labels therefore need en and zh.
# Topics are labels for what a stage covers; they are not links and do not imply
# finished lessons.
#
# Each stage is one Academy subject with its own page (`url`, mirrored under
# /zh): a short introduction, its part of the knowledge graph
# (_data/knowledge_graph.yml), the lessons below and its resources. `color`
# identifies the subject in the graph. `examples` names website artifacts in
# _data/hub.yml (teaching netlists and scripts) shown as practical examples;
# Academy labs are found by their lesson URL. `resources` lists further pages
# that support the subject; `localised: true` means the path exists under /zh.
#
# A generated lesson missing from every stage is still listed on the Academy
# entry point in its own language, and tests/test_hub.py reports it.

intro:
  en: "Learn power engineering from first principles to AI-assisted engineering: foundations, power electronics, power systems and renewable energy."
  zh: "从基本原理到 AI 辅助工程，系统学习电力工程：基础、电力电子、电力系统与可再生能源。"

stages:
  - number: "01"
    key: foundations
    url: /academy/foundations/
    color: "#c79522"
    title: {en: "Foundations", zh: "基础"}
    summary:
      en: "Build the map of the field and the circuit, energy and signal ideas every later stage relies on."
      zh: "建立对本领域的整体认识，掌握后续各阶段都要用到的电路、能量与信号概念。"
    topics:
      en: [Electricity, Circuits, Energy, Signals]
      zh: [电学基础, 电路, 能量, 信号]
    lessons:
      - /academy/foundations/orientation/
      - /academy/foundations/foundations/
      - /academy/foundations/dc-circuit-fundamentals/
      - /academy/foundations/prerequisite-path-zh/
      - /academy/foundations/first-circuit-zh/
    hub: [devices]
    resources:
      - url: https://github.com/FulongLi/AIPE-Academy/blob/main/START-HERE.md
        label: {en: "Start here: learning with an AI tutor", zh: "从这里开始：与 AI 导师一起学习（英文）"}
  - number: "02"
    key: power-electronics
    url: /academy/power-electronics/
    color: "#5f8fe0"
    title: {en: "Power Electronics", zh: "电力电子"}
    summary:
      en: "Model the switch, design steady-state converters, then move to dynamics, control, magnetics and the practical constraints of real products."
      zh: "建立开关器件模型并设计稳态变换器，再走向动态特性、控制、磁性元件，以及实际产品中的工程约束。"
    topics:
      en: [Devices, Converters, Magnetics, Control, Simulation, Thermal, PCB / CAD]
      zh: [器件, 变换器, 磁性元件, 控制, 仿真, 热设计, PCB / CAD]
    lessons:
      - /academy/power-electronics/components/
      - /academy/power-electronics/converters/
      - /academy/power-electronics/buck-converter-fundamentals/
      - /academy/power-electronics/buck-converter/
      - /academy/power-electronics/dynamics-and-control/
      - /academy/power-electronics/practical-design/
      - /academy/power-electronics/systems-applications/
    hub: [devices, converters, magnetics, control]
    examples: [site.converter-netlists, site.ccm-analysis-scripts, site.llc-fha-gain]
    planned_labs: true
  # Power Systems and Renewable Energy each have one complete English lesson in
  # v0.2; their Chinese entry points still show a planned state.
  - number: "03"
    key: power-systems
    url: /academy/power-systems/
    color: "#8d70dc"
    title: {en: "Power Systems", zh: "电力系统"}
    summary:
      en: "Connect converters to grids and microgrids: power flow, grid interfaces, solid-state transformers and system stability."
      zh: "把变换器接入电网与微电网：潮流、电网接口、固态变压器与系统稳定性。"
    topics:
      en: [Grid Interfaces, Microgrids, Solid-State Transformers, Stability]
      zh: [电网接口, 微电网, 固态变压器, 稳定性]
    lessons:
      - /academy/power-systems/three-phase-fundamentals/
    hub: [microgrids, systems]
  - number: "04"
    key: renewable-energy
    url: /academy/renewable-energy/
    color: "#3fb58e"
    title: {en: "Renewable Energy", zh: "可再生能源"}
    summary:
      en: "Convert, store and integrate energy from solar, wind and storage systems, through power electronics and the grid."
      zh: "转换、存储并接入来自光伏、风电与储能系统的能量。"
    topics:
      en: [Solar PV, Wind, Energy Storage, Energy Conversion, Grid Integration]
      zh: [光伏, 风电, 储能, 能量转换, 并网]
    lessons:
      - /academy/renewable-energy/solar-pv-fundamentals/
    hub: [storage]
    resources:
      - url: /power/microgrids/
        localised: true
        label: {en: "Solar, wind and storage in microgrids", zh: "微电网中的光伏、风电与储能"}
