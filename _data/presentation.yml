# Human-facing copy for the bilingual About pages.
about:
  title: {en: About AIPE Labs, zh: 关于 AIPE Labs}
  intro:
    en: "AIPE Labs is an open resource platform for power electronics and power engineering. We bring together learning material, engineering data and practical tools, helping students, engineers and researchers find useful resources and put them to work."
    zh: "AIPE Labs 是一个面向电力电子与电力工程的开放资源平台。我们整合学习资料、工程数据与实用工具，帮助学习者、工程师和研究者更高效地检索和使用资源，将知识应用于实践。"
  action: {en: Browse resources, zh: 浏览工程资源}
  mission_kicker: {en: What the platform brings together, zh: 平台整合的资源}
  mission_title: {en: "Knowledge, data and tools, connected.", zh: "汇集资源，连接学习与实践。"}
  mission_text:
    en: "Useful engineering resources are often scattered across courses, publications and individual projects. AIPE brings them into a shared index, connecting a question or task with relevant knowledge, data and tools. Our scope spans devices, converters and power systems, with each resource's source and current status made visible."
    zh: "有价值的工程资源往往分散在课程、文献和各类项目中。AIPE 将这些资源汇集到统一索引中，让学习问题与工程任务能够连接到相关的知识、数据和工具。平台覆盖器件、变换器与电力系统，并清楚标明各项资源的来源和当前状态。"
  scales:
    - title: {en: Learning resources, zh: 学习资源}
      text: {en: "Find explanations, tutorials and open labs, from fundamental principles to engineering applications.", zh: "从基础原理到工程应用，查找知识讲解、教程与开放实验。"}
    - title: {en: Engineering data, zh: 工程数据}
      text: {en: "Explore component data, models and reference designs with traceable sources.", zh: "查阅器件数据、模型与参考设计，并追溯其来源。"}
    - title: {en: Practical tools, zh: 实用工具}
      text: {en: "Discover engineering software, simulation workflows and AI-assisted tools for your next task.", zh: "为实际任务寻找工程软件、仿真工作流与 AI 辅助工具。"}
  founder_kicker: {en: A note from the founder, zh: 创始人的话}
  founder_title: {en: Why I built AIPE, zh: 为什么我想做 AIPE}
  founder_intro:
    en: "After more than a decade of studying, researching and working in power electronics and energy, I wanted to make the knowledge and resources I had gathered easier for others to find and use. AIPE is my way of turning that experience into an open platform others can learn from, contribute to and build upon."
    zh: "在电力电子与能源领域学习、研究和工作十多年后，我希望把积累的知识与资源整理出来，让更多人能够方便地找到并使用。AIPE 是我把这些经验转化为开放平台的一次尝试，让大家能够在此学习、贡献，并继续构建自己的成果。"
  founder_name: {en: Fulong Li, zh: 李富龙}
  founder_role: {en: "Founder, AIPE Labs", zh: AIPE Labs 创始人}
  founder_read: {en: Read the full founder's letter, zh: 阅读创始人的完整文字}
  loop_kicker: {en: The longer-term vision, zh: 长期愿景}
  loop_title: {en: "An open foundation that grows through practice.", zh: "开放共享，持续完善。"}
  loop_intro:
    en: "AIPE began as AI for Power Electronics and has grown towards the wider field of power engineering. Our long-term aim is a shared foundation that people and their AI tools can use and improve. Each contribution of knowledge, data or practical experience gives the next project a better starting point."
    zh: "AIPE 从 AI for Power Electronics 起步，逐步拓展到更广泛的电力工程领域。我们希望建立一个人与 AI 工具都能使用和完善的共享基础，让每一次知识、数据和实践经验的贡献，都成为后续工作的更好起点。"
  contact_title: {en: Let's build the next part together., zh: 一起继续向前。}
  contact_intro: {en: "We welcome engineers, researchers and organisations who want to contribute to open power engineering.", zh: "欢迎工程师、研究者和企业参与开放电力工程的建设。"}
  contact_action: {en: Get in touch, zh: 联系我们}
