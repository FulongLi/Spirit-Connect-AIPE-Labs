home:
  collaborate_action: {en: Get in touch, zh: 联系我们}
about:
  kicker: {en: About AIPE Labs, zh: 关于 AIPE Labs}
  title: {en: "Engineering knowledge should be a foundation we share.", zh: "让工程知识，成为大家共同的基石。"}
  intro:
    en: "AIPE Labs is an open power engineering initiative by Spirit Connect. We bring together knowledge, data and tools that engineers — and their AI agents — can build on."
    zh: "AIPE Labs 是 Spirit Connect 发起的开放电力工程项目。我们汇集知识、数据与工具，让工程师和他们的 AI 助手都能在此基础上继续构建。"
  action: {en: Explore our work, zh: 查看我们的工作}
  mission_kicker: {en: Our purpose, zh: 我们的使命}
  mission_title: {en: "Make it easier to learn, build and contribute.", zh: "让学习、实践与贡献变得更容易。"}
  mission_text:
    en: "AIPE began as AI for Power Electronics. As the work grew from devices and converters towards energy systems, it became AI for Power Engineering. The ambition is the same: turn engineering experience into an open foundation that others can use, question and improve."
    zh: "AIPE 最初代表 AI for Power Electronics，随着工作从器件和变换器拓展到能源系统，逐步演进为 AI for Power Engineering。我们的初衷始终如一：把工程经验变成开放的基础，让更多人能够使用、质疑并改进它。"
  scales:
    - title: {en: Devices, zh: 器件}
      text: {en: "Understand the components through characterisation, data and modelling.", zh: "通过表征、数据与建模，理解元器件。"}
    - title: {en: Converters, zh: 变换器}
      text: {en: "Connect topology, magnetics and control through design and simulation.", zh: "以设计和仿真连接拓扑、磁性元件与控制。"}
    - title: {en: Systems, zh: 系统}
      text: {en: "Place each design in the wider context of power and energy infrastructure.", zh: "把每一项设计放到电力与能源基础设施中考量。"}
  founder_kicker: {en: A note from the founder, zh: 创始人的话}
  founder_title: {en: Why I built AIPE, zh: 为什么我想做 AIPE}
  founder_intro:
    en: "After more than a decade in power electronics and energy, I wanted to turn what I had learnt into something others could build upon. My hope is that AIPE helps more people find their interests, develop their abilities and contribute work they care about."
    zh: "在电力电子和能源领域学习、研究与工作十多年后，我想把积累下来的经验变成一块基石。我希望 AIPE 能帮助更多人找到兴趣、发展能力，并投入自己真正在乎的工作。"
  founder_name: {en: Fulong Li, zh: 李富龙}
  founder_role: {en: "Founder, AIPE Labs", zh: AIPE Labs 创始人}
  founder_read: {en: Read the full founder's letter, zh: 阅读创始人的完整文字}
  loop_kicker: {en: The longer-term vision, zh: 长期愿景}
  loop_title: {en: "Better engineering. Better foundations for AI.", zh: "更好的工程实践，更扎实的 AI 基础。"}
  loop_intro:
    en: "AI can help engineers design power systems. Those systems provide energy for computing. Sharing the data, models and lessons from each project can make the next one better."
    zh: "AI 帮助工程师设计电力系统，电力系统为计算提供能源。把项目中的数据、模型和经验分享出来，让下一次设计拥有更好的起点。"
  contact_title: {en: Let's build the next part together., zh: 一起继续向前。}
  contact_intro: {en: "We welcome engineers, researchers and organisations who want to contribute to open power engineering.", zh: "欢迎工程师、研究者和企业参与开放电力工程的建设。"}
