# AIPE Hub presentation mapping.
#
# This file decides only WHERE an artifact appears on the website (Hub category,
# engineering domains, featured order and on-site pages). It must not restate
# capability metadata. Registry artifacts (`registry:`) take their name, type,
# maturity, integration, licence, capabilities, limitations and repository from
# _data/registry.json, a byte-identical mirror of the published /aipe.json.
# Academy artifacts (`academy:`) take title, status and duration from the
# generated lesson page front matter. Only artifacts owned by this website
# (`id: site.*`) describe themselves here.
#
# Registry descriptions are English. Chinese pages never show them: each
# Registry artifact carries a presentation-owned `zh_summary`, a reviewed Chinese
# rendering of its Registry description. Refresh it in the same PR when the
# Registry description changes meaning.
#
# tests/test_hub.py fails when a Registry capability is not placed, when an ID or
# URL does not resolve, or when the mirror drifts from /aipe.json. Add new
# capabilities by refreshing the Registry snapshot, then placing them below.
#
# Hub project cards. The Hub pages show only artifacts that carry a `card`, in
# the order they appear below. A card is deliberately minimal:
#   summary  one or two sentences, en and zh
#   status   optional; set it only when the project is still being developed,
#            and keep it in line with the project's own repository
# The card links to the artifact's first on-site link (when it has one) and to
# its GitHub repository. Artifacts without a card stay placed — in the Registry,
# Engineering, Academy and search — but are not shown as Hub project cards.

# Artifact dimension, in display order. Three public Hub categories, each with
# its own page. `platform` (Core, Registry, Academy, presentation) and `academy`
# (teaching labs, netlists and scripts presented by the Academy) are internal
# placements with no Hub page. The former /hub/models/, /hub/designs/ and
# /hub/labs/ URLs redirect (legacy/).
categories:
  - key: data
    url: /hub/data/
    title: {en: "Data & Models", zh: "数据与模型"}
    summary:
      en: "Engineering databases and models for power semiconductors and magnetic components."
      zh: "面向功率半导体与磁性元件的工程数据库与模型。"
  - key: tools
    url: /hub/tools/
    title: {en: "Tools & Agents", zh: "工具与智能体"}
    summary:
      en: "Tools and AI agents for schematics, PCB design and research writing."
      zh: "用于原理图、PCB 设计与科研写作的工具和 AI 智能体。"
  - key: workflows
    url: /hub/workflows/
    title: {en: "Workflows", zh: "工作流"}
    summary:
      en: "Complete engineering processes built on AIPE projects."
      zh: "基于 AIPE 项目的完整工程流程。"

# Engineering (domain) dimension. `url` is the dedicated domain page when one
# exists; otherwise the domain is presented on /engineering/#<key>.
# `blog_anchor` points to the matching series on /resources/blog/ and
# `blog_flag` is the post front-matter flag that series uses.
domains:
  - key: devices
    url: /power/devices/
    blog_anchor: device-series
    blog_flag: device_testing_series
    title: {en: "Devices", zh: "器件"}
    summary:
      en: "Power semiconductors, characterisation, losses and reliability."
      zh: "功率半导体、器件表征、损耗与可靠性。"
  - key: magnetics
    title: {en: "Magnetics", zh: "磁性元件"}
    summary:
      en: "Cores, windings, inductors, transformers and current sensing."
      zh: "磁芯、绕组、电感、变压器与电流传感。"
  - key: converters
    url: /power/converters/
    blog_anchor: converter-series
    blog_flag: converter_series
    title: {en: "Converters", zh: "变换器"}
    summary:
      en: "Topologies, steady-state design, simulation and wireless power."
      zh: "拓扑、稳态设计、仿真与无线电能传输。"
  - key: control
    title: {en: "Control", zh: "控制"}
    summary:
      en: "Averaged models, loop design and digital control debugging."
      zh: "平均模型、环路设计与数字控制调试。"
  - key: storage
    title: {en: "Energy Storage", zh: "储能"}
    summary:
      en: "Battery and storage interfaces for power conversion systems."
      zh: "面向功率变换系统的电池与储能接口。"
  - key: microgrids
    url: /power/microgrids/
    title: {en: "Microgrids", zh: "微电网"}
    summary:
      en: "DC, AC and hybrid microgrids, control and energy management."
      zh: "直流、交流与交直流混合微电网，控制与能量管理。"
  - key: systems
    blog_anchor: sst-series
    blog_flag: sst_series
    title: {en: "Energy Systems", zh: "能源系统"}
    summary:
      en: "Solid-state transformers, system integration and grid interfaces."
      zh: "固态变压器、系统集成与电网接口。"

