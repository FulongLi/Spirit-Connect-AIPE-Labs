      en: "Modular solid-state transformer architecture and system-integration reference."
      zh: "模块化固态变压器架构与系统集成参考。"
  - id: site.rogowski-coil
    category: workflows
    type: reference_design
    status: reference
    domains: [magnetics]
    url: /resources/prototypes/rogowski-coil/
    localised: true
