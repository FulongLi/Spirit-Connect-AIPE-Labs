# Placement of every artifact. `featured` orders the homepage feed.
# `pending_repository: true` marks Registry entries whose canonical GitHub
# repository is still empty; remove the flag once the repository is published.
# Card statuses were checked against each repository on 2026-10-19.
artifacts:
  # ── Data & Models ──
  - registry: aipe.semiconductor-database
    zh_summary: "规范的 V3 功率半导体记录，包含 SI 单位曲线、来源权利信息与证据溯源，并提供一个保守的 Core 候选数据适配器。"
    category: data
    domains: [devices]
    featured: 1
    card:
      summary:
        en: "Power semiconductor data, device characteristics and engineering models."
        zh: "功率半导体数据、器件特性与工程模型。"
    links:
      - url: /database/transistors/
        localised: true
        label: {en: "Transistor data overview", zh: "晶体管数据概览"}
  - registry: aipe.magnetics-database
    zh_summary: "以证据为先的磁性元件数据记录框架，涵盖材料、几何结构、绕组、元件、损耗模型与测量记录，并明确使用 SI 单位。"
    category: data
    domains: [magnetics]
    featured: 2
    card:
      # v0.2 on GitHub; every result reports "L0 unverified" until verification
      # evidence is recorded.
      status: in-development
      summary:
        en: "Magnetic materials, core data, loss models and magnetics design resources."
        zh: "磁性材料、磁芯数据、损耗模型与磁性元件设计资源。"
    links:
      - url: /database/magnetics/
        localised: true
        label: {en: "Magnetics data overview", zh: "磁性元件数据概览"}

  # ── Academy: teaching models ── (files published by this website with the
  # converter tutorials; presented in the Academy, not as Hub project cards)
