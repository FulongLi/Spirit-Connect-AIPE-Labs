      en: "AI-assisted power-electronics PCB engineering with reproducible KiCad automation. Its 5 kW SiC buck example is an engineering prototype under review; nothing has been fabricated or energised."
      zh: "AI 辅助的电力电子 PCB 工程，基于可复现的 KiCad 自动化。其 5 kW SiC Buck 示例是正在评审的工程原型，尚未制板或通电。"
    card:
      # README: "engineering prototype review; release blocked".
      status: prototype
      summary:
        en: "AI-assisted PCB design, routing and engineering review using KiCad."
        zh: "基于 KiCad 的 AI 辅助 PCB 设计、布线与工程评审。"
  - registry: aipe.ieee-paper-agent
    zh_summary: "关联证据的科研规划，以及面向特定 IEEE 期刊与会议的论文撰写。"
    category: tools
    domains: []
    card:
      summary:
        en: "AI-assisted research planning and IEEE manuscript preparation."
        zh: "AI 辅助的科研规划与 IEEE 论文撰写。"
  # Placed but not shown as Hub cards for now (still in the Registry, the
  # homepage feed, Engineering and search).
  - registry: aipe.simulation-skills
    zh_summary: "面向工程用途的仿真、控制、CAD、PCB 与场分析技能，默认使用开源工具，并保留可选的商业软件工作流。"
    category: tools
    domains: [converters, control, magnetics]
    featured: 4
  - registry: aipe.design-agent
    zh_summary: "通过 Core 工程状态与注册表能力，逐步编排关联证据的工程工作，同时保留现有的 PEA 计算器与接口。"
    category: tools
    domains: [converters]
    featured: 5
  - registry: aipe.open-source-catalogue
    zh_summary: "社区整理的外部工程工具目录，附有注明日期的维护状态、许可与自动化能力依据。"
    category: tools
    domains: []

  # ── Workflows ── Only processes backed by a published project are listed.
  - id: site.pcb-design-workflow
    category: workflows
    type: workflow
    status: prototype
    domains: [converters]
    url: https://github.com/FulongLi/AIPE-PCB-Agent/tree/main/examples/sic-buck-400v-200v-5kw-v3
    title: {en: "PCB Design", zh: "PCB 设计"}
    description:
      en: "Schematic sheets, routed KiCad boards, native ERC/DRC checks and a recorded design review, built with AIPE PCB Agent and shown on a 5 kW SiC buck. Hardware qualification and human review remain open."
      zh: "原理图、完成布线的 KiCad 电路板、原生 ERC/DRC 检查与有记录的设计评审，由 AIPE PCB Agent 完成，并以 5 kW SiC Buck 为示例。硬件验证与人工评审仍未完成。"
    card:
      status: prototype
      summary:
        en: "From schematic sheets to routed, rule-checked KiCad boards and a recorded design review, built with AIPE PCB Agent. The 5 kW SiC buck example has not been built or tested."
        zh: "从原理图到完成布线并通过规则检查的 KiCad 电路板，再到有记录的设计评审，由 AIPE PCB Agent 完成。5 kW SiC Buck 示例尚未制板或测试。"
  - id: site.magnetics-design-workflow
    category: workflows
    type: workflow
    status: in-development
    domains: [magnetics]
    url: https://github.com/FulongLi/AIPE-Magnetics-Database
    title: {en: "Magnetics Design", zh: "磁性元件设计"}
    description:
