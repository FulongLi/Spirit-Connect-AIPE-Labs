    category: academy
    type: simulation_model
    status: draft
    domains: [converters]
    title: {en: "Open-loop converter netlists", zh: "开环变换器网表"}
    description:
      en: "LTspice teaching netlists for nine converter stages with generic lossy elements. Each file states that native LTspice execution is pending; none is a validated hardware BOM."
      zh: "九种变换器的 LTspice 教学网表，采用通用有损元件。每个文件均注明尚待在 LTspice 中原生运行，且不是经过验证的硬件物料清单。"
    tools: [LTspice]
    files:
      - /assets/downloads/buck-converter/buck_open_loop.cir
      - /assets/downloads/boost-converter/boost_open_loop.cir
      - /assets/downloads/buck-boost-converter/buckboost_open_loop.cir
      - /assets/downloads/cuk-sepic-zeta/cuk_open_loop.cir
      - /assets/downloads/cuk-sepic-zeta/sepic_open_loop.cir
      - /assets/downloads/flyback-converter/flyback_open_loop.cir
      - /assets/downloads/forward-converter/forward_2sw_open_loop.cir
      - /assets/downloads/bridge-converters/halfbridge_open_loop.cir
      - /assets/downloads/llc-converter/llc_open_loop.cir
    links:
      - url: /resources/blog/#converter-series
        localised: true
        label: {en: "Source tutorials", zh: "对应教程"}
    featured: 7
  - id: site.ccm-analysis-scripts
    category: academy
    type: analytical_model
    status: draft
    domains: [converters, control]
    title: {en: "Ideal CCM analysis scripts", zh: "理想 CCM 分析脚本"}
    description:
      en: "MATLAB teaching scripts for ideal continuous-conduction buck, boost, buck-boost and flyback stages with a resistive load. They require MATLAB and the Control System Toolbox."
      zh: "用于理想连续导通模式 Buck、Boost、Buck-Boost 与反激变换器（电阻负载）的 MATLAB 教学脚本，需要 MATLAB 与 Control System Toolbox。"
    tools: [MATLAB]
    files:
      - /assets/downloads/buck-converter/buck_ccm_analysis.m
      - /assets/downloads/boost-converter/boost_ccm_analysis.m
      - /assets/downloads/buck-boost-converter/buckboost_ccm_analysis.m
      - /assets/downloads/flyback-converter/flyback_ccm_analysis.m
    links:
      - url: /resources/blog/#converter-series
        localised: true
        label: {en: "Source tutorials", zh: "对应教程"}
  - id: site.llc-fha-gain
    category: academy
    type: analytical_model
    status: draft
    domains: [converters]
    title: {en: "LLC first-harmonic gain curves", zh: "LLC 基波近似增益曲线"}
