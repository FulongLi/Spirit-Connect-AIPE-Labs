      zh: "PCB 罗氏线圈电流传感器的原理、几何结构、绕线方式与设计要点。"

  # ── Academy: labs ── (Academy lessons of type `lab`; the Academy finds its
  # labs by the `academy` field, not by category)
  - academy: /academy/power-electronics/buck-open-lab/
    category: academy
    type: lab
    # The lesson is English-only; Chinese pages show this title with a
    # "content in English" note instead of the English lesson title.
    title: {zh: "预测并核对理想 Buck 变换器"}
    domains: [converters]
    featured: 8
    description:
      en: "Predict duty ratio, output current and inductor ripple for an ideal 24 V to 12 V buck, then check them with an open Python script. No commercial licence, API key or hardware is needed."
      zh: "预测理想 24 V 转 12 V Buck 变换器的占空比、输出电流与电感纹波，并用开源 Python 脚本核对。无需商业许可、API 密钥或硬件。"

  # ── Platform layer ── (infrastructure that the artifacts above build on)
