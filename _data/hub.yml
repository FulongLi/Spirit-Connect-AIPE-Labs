  # ── Tools & Agents ──
  - registry: aipe.sketch
    zh_summary: "把显式的电路中间表示（Circuit IR）渲染为经过连接性检查、带来源记录的 SVG 原理图。"
    category: tools
    domains: [converters]
    featured: 3
    card:
      summary:
        en: "Generate clear and structured electrical schematics automatically."
        zh: "自动生成清晰、结构化的电路原理图。"
    links:
      - url: /resources/ai-agent-team/aipe-sketch/
        localised: true
        label: {en: "Guide", zh: "使用指南"}
  - registry: aipe.pcb-agent
    zh_summary: "面向电力电子的 AI 辅助 PCB 工程：由需求文件驱动的 KiCad 原理图、封装库、布局、网格布线、原生 ERC/DRC 校验与制造输出清单。10 kW DAB 三块板（原边功率、副边功率、控制）已生成并执行 ERC/DRC：ERC 零告警，功率板布线尚未完成（各约 80 个未连接项），控制板仅完成布局；未制板、未通电。"
    category: tools
    domains: [converters]
    card:
      status: prototype
      summary:
        en: "AI-assisted power-electronics PCB engineering with reproducible KiCad automation: requirement-driven schematics, footprint libraries, placement, grid routing, native ERC/DRC and hashed manufacturing exports. The three 10 kW DAB boards (primary power, secondary power, control) are generated with ERC clean; power-board routing is unfinished (about 80 open connections each) and the control board is placed only. Nothing has been fabricated or energised."
        zh: "AI 辅助的电力电子 PCB 工程，基于可复现的 KiCad 自动化：需求驱动的原理图、封装库、布局、网格布线、原生 ERC/DRC 与带哈希的制造输出。10 kW DAB 三块板（原边功率、副边功率、控制）已生成且 ERC 零告警；功率板布线尚未完成（各约 80 个未连接项），控制板仅完成布局。未制板、未通电。"
    links:
      - url: https://github.com/FulongLi/AIPE-PCB-Agent/tree/feat/dab-10kw-workflow/examples/dab-10kw
        label: {en: "DAB boards (branch)", zh: "DAB 电路板（分支）"}
  - registry: aipe.ieee-paper-agent
    zh_summary: "关联证据的科研规划，以及面向特定 IEEE 期刊与会议的论文撰写。"
    category: tools
    domains: []
    card:
      summary:
        en: "AI-assisted research planning and IEEE manuscript preparation."
        zh: "AI 辅助的科研规划与 IEEE 论文撰写。"
    links:
      - url: /resources/ai-agent-team/aipe-ieee-paper-agent/
        localised: true
        label: {en: "Guide", zh: "使用指南"}
  # Placed but not shown as Hub cards for now (still in the Registry, the
  # homepage feed, Engineering and search).
  - registry: aipe.simulation-skills
    zh_summary: "面向工程用途的仿真、控制、CAD、PCB 与场分析技能，默认使用开源工具，并保留可选的商业软件工作流。"
    category: tools
    domains: [converters, control, magnetics]
    featured: 4
  - registry: aipe.electrical-design
    zh_summary: "电气设计解析库 aipe_electrical（原 AIPE Design Agent）：带显式 SI 单位与符号约定的无损单移相双有源桥模型、CCM DC-DC 参数整定与一阶 Buck 损耗；供 AIPE-Workflows 的解析设计阶段调用。"
    category: tools
    domains: [converters]
    featured: 5
    card:
      status: prototype
      summary:
        en: "Analytical electrical design library (aipe_electrical, formerly the AIPE Design Agent): lossless single-phase-shift dual-active-bridge model with explicit SI units and sign conventions, CCM DC-DC sizing and first-order buck losses; the analytical design stage of AIPE-Workflows."
        zh: "电气设计解析库 aipe_electrical（原 AIPE Design Agent）：带显式 SI 单位与符号约定的无损单移相双有源桥模型、CCM DC-DC 参数整定与一阶 Buck 损耗；AIPE-Workflows 的解析设计阶段。"
  - registry: aipe.design-agent
    zh_summary: "历史能力标识：AIPE Design Agent 已更名为 AIPE-Electrical-Design 并重构为 aipe_electrical；此条目作为迁移别名保留至消费者完成迁移。"
    category: tools
    domains: [converters]
    card:
      status: archived
      summary:
        en: "Legacy identity of the AIPE Design Agent, renamed AIPE-Electrical-Design and refactored into aipe_electrical; kept as a migration alias until its consumers have moved."
        zh: "AIPE Design Agent 的历史标识，已更名为 AIPE-Electrical-Design 并重构为 aipe_electrical；作为迁移别名保留至消费者完成迁移。"
  - registry: aipe.thermal-design
    zh_summary: "热设计解析库 aipe_thermal（原 HeatSinkOptimisation）：板翅散热器关联模型（自然/强迫对流、压降与风扇工作点、扩散热阻、Pareto 优化）、共用散热器热网络与 Foster/Cauer 瞬态阻抗、电热迭代、自然/风冷/液冷方案比较与 Stage A 散热器筛选；无 CFD、FEM 或测量值。"
    category: tools
    domains: [converters]
    card:
      status: prototype
      summary:
        en: "Analytical thermal design library (aipe_thermal, formerly HeatSinkOptimisation): plate-fin heat-sink correlation model (natural and forced convection, pressure drop and fan operating point, spreading, Pareto optimisation), shared-sink thermal networks with Foster/Cauer transients, electrothermal iteration, natural / forced-air / liquid cooling comparison and Stage A heat-sink screening. No CFD, FEM or measured values."
        zh: "热设计解析库 aipe_thermal（原 HeatSinkOptimisation）：板翅散热器关联模型、共用散热器热网络与 Foster/Cauer 瞬态阻抗、电热迭代、自然/风冷/液冷方案比较与 Stage A 散热器筛选；无 CFD、FEM 或测量值。"
  - registry: aipe.open-source-catalogue
    zh_summary: "社区整理的外部工程工具目录，附有注明日期的维护状态、许可与自动化能力依据。"
    category: tools
    domains: []
  - registry: aipe.doc
    zh_summary: "AIPE 品牌的 HTML 文档与幻灯片模板（A4 与 16:9 打印版式），含共享样式、链接检查器与预览服务；AIPE-Workflows 的工程评审包使用该文档版式渲染。"
    category: platform
    domains: []

  - registry: aipe.field-simulation
    zh_summary: "基于 Gmsh 与 Elmer 的开源有限元仿真：变压器窗口二维磁场（漏感、励磁电感）与散热器三维导热，均经网格收敛与解析基准校核，并产生带来源记录的工况文件；在 10 kW DAB 工作流中按所选磁芯与散热器候选执行。"
    category: tools
    domains: [magnetics, converters]
    card:
      status: prototype
      summary:
        en: "Executed Gmsh + Elmer field simulation: 2-D transformer-window magnetostatics (leakage and magnetising inductance) and 3-D heat-sink conduction, each with mesh-convergence levels, analytic benchmarks and provenance-carrying case files. Used by the DAB workflow on the selected core and heat-sink candidate."
        zh: "真实执行的 Gmsh + Elmer 场仿真：变压器窗口二维磁场（漏感与励磁电感）与散热器三维导热，均带网格收敛层级、解析基准与来源记录的工况文件；在 DAB 工作流中按所选磁芯与散热器候选执行。"
  - registry: aipe.cad-agent
    zh_summary: "由 SI 单位 JSON 参数驱动的 FreeCAD 参数化几何：E 型磁芯变压器、板翅散热器、液冷板与整机装配，输出 STEP/FCStd、网格提示元数据以及干涉、配合与电气间隙检查报告；在 10 kW DAB 工作流中由工程状态生成变压器与散热器模型。"
    category: tools
    domains: [converters]
    card:
      status: prototype
      summary:
        en: "Parametric FreeCAD geometry from SI-unit JSON parameters: E-core transformers, plate-fin heat sinks, liquid cold plates and converter assemblies, with STEP/FCStd export, mesh-hint metadata and interference, fit and clearance check reports. The DAB workflow builds its transformer and heat sink from the Engineering State."
        zh: "由 SI 单位 JSON 参数驱动的 FreeCAD 参数化几何：E 型磁芯变压器、板翅散热器、液冷板与整机装配，输出 STEP/FCStd、网格提示元数据以及干涉、配合与电气间隙检查报告；DAB 工作流由工程状态生成变压器与散热器模型。"
  # ── Workflows ── Only processes backed by a published project are listed.
  - registry: aipe.workflows
    zh_summary: "系统级工程工作流引擎：在 AIPE 专项能力之上执行带类型、带检查点的任务图，具备本地工具检验、工程状态溯源、验证关卡与报告生成；首个基准是仿真驱动的 10 kW 双有源桥变换器。"
    category: workflows
    domains: [converters, control]
    featured: 9
    card:
      status: in-development
      summary:
        en: "Simulation-driven converter design on a 10 kW dual active bridge: analytical SPS design, executed ngspice switching simulation (ideal and behavioural), SPS control baseline, waveform-informed magnetics, device screening and losses, cooling comparison and heat-sink screening, Gmsh/Elmer FEM checks and FreeCAD geometry, all in one checkpointed task graph with an evidence-linked review package. PCB, measurement and hardware stages are separate gates."
        zh: "以 10 kW 双有源桥为例的仿真驱动变换器设计：SPS 解析设计、真实 ngspice 开关仿真（理想与行为级）、SPS 控制基线、由波形驱动的磁件设计、器件筛选与损耗、散热方案比较与散热器筛选、Gmsh/Elmer 有限元校核与 FreeCAD 几何，全部纳入一个带检查点的任务图并生成关联证据的评审包。PCB、测量与硬件阶段为独立关卡。"
    links:
      - url: /resources/prototypes/dab/
        localised: true
        label: {en: "DAB workflow page", zh: "DAB 工作流页面"}
  - id: site.pcb-design-workflow
    category: workflows
    type: workflow
    status: prototype
    domains: [converters]
    url: https://github.com/FulongLi/AIPE-PCB-Agent/tree/main/examples/sic-buck-400v-200v-5kw-v3
    title: {en: "PCB Design", zh: "PCB 设计"}
