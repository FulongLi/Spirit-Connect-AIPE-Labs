# Placement of every artifact. `featured` orders the homepage feed.
# `pending_repository: true` marks Registry entries whose canonical GitHub
# repository is still empty; remove the flag once the repository is published.
# Card statuses were checked against each repository on 2026-10-19.
artifacts:
  # ── Data & Models ──
  - registry: aipe.semiconductor-database
    zh_summary: "规范的 V3 功率半导体记录，包含 SI 单位曲线、来源权利信息与证据溯源，并提供一个保守的 Core 候选数据适配器。"
    category: data
    domains: [devices]
    featured: 1
    card:
      summary:
        en: "Power semiconductor data, device characteristics and engineering models."
        zh: "功率半导体数据、器件特性与工程模型。"
    links:
      - url: /database/transistors/
        localised: true
        label: {en: "Transistor data overview", zh: "晶体管数据概览"}
  - registry: aipe.magnetics-database
    zh_summary: "以证据为先的磁性元件数据记录框架，涵盖材料、几何结构、绕组、元件、损耗模型与测量记录，并明确使用 SI 单位。"
    category: data
    domains: [magnetics]
    featured: 2
    card:
      # v0.2 on GitHub; every result reports "L0 unverified" until verification
      # evidence is recorded.
      status: in-development
      summary:
        en: "Magnetic materials, core data, loss models and magnetics design resources."
        zh: "磁性材料、磁芯数据、损耗模型与磁性元件设计资源。"
    links:
      - url: /database/magnetics/
        localised: true
        label: {en: "Magnetics data overview", zh: "磁性元件数据概览"}

  # ── Academy: teaching models ── (files published by this website with the
  # converter tutorials; presented in the Academy, not as Hub project cards)
  - id: site.converter-netlists
    category: academy
    type: simulation_model
    status: draft
    domains: [converters]
    title: {en: "Open-loop converter netlists", zh: "开环变换器网表"}
    description:
      en: "LTspice teaching netlists for nine converter stages with generic lossy elements. Each file states that native LTspice execution is pending; none is a validated hardware BOM."
      zh: "九种变换器的 LTspice 教学网表，采用通用有损元件。每个文件均注明尚待在 LTspice 中原生运行，且不是经过验证的硬件物料清单。"
    tools: [LTspice]
    files:
      - /assets/downloads/buck-converter/buck_open_loop.cir
      - /assets/downloads/boost-converter/boost_open_loop.cir
      - /assets/downloads/buck-boost-converter/buckboost_open_loop.cir
      - /assets/downloads/cuk-sepic-zeta/cuk_open_loop.cir
      - /assets/downloads/cuk-sepic-zeta/sepic_open_loop.cir
      - /assets/downloads/flyback-converter/flyback_open_loop.cir
      - /assets/downloads/forward-converter/forward_2sw_open_loop.cir
      - /assets/downloads/bridge-converters/halfbridge_open_loop.cir
      - /assets/downloads/llc-converter/llc_open_loop.cir
    links:
      - url: /resources/blog/#converter-series
        localised: true
        label: {en: "Source tutorials", zh: "对应教程"}
    featured: 7
  - id: site.ccm-analysis-scripts
    category: academy
    type: analytical_model
    status: draft
    domains: [converters, control]
    title: {en: "Ideal CCM analysis scripts", zh: "理想 CCM 分析脚本"}
    description:
      en: "MATLAB teaching scripts for ideal continuous-conduction buck, boost, buck-boost and flyback stages with a resistive load. They require MATLAB and the Control System Toolbox."
      zh: "用于理想连续导通模式 Buck、Boost、Buck-Boost 与反激变换器（电阻负载）的 MATLAB 教学脚本，需要 MATLAB 与 Control System Toolbox。"
    tools: [MATLAB]
    files:
      - /assets/downloads/buck-converter/buck_ccm_analysis.m
      - /assets/downloads/boost-converter/boost_ccm_analysis.m
      - /assets/downloads/buck-boost-converter/buckboost_ccm_analysis.m
      - /assets/downloads/flyback-converter/flyback_ccm_analysis.m
    links:
      - url: /resources/blog/#converter-series
        localised: true
        label: {en: "Source tutorials", zh: "对应教程"}
  - id: site.llc-fha-gain
    category: academy
    type: analytical_model
    status: draft
    domains: [converters]
    title: {en: "LLC first-harmonic gain curves", zh: "LLC 基波近似增益曲线"}
    description:
      en: "First-harmonic-approximation gain curves for an LLC resonant converter. Runs in MATLAB or GNU Octave without a toolbox."
      zh: "LLC 谐振变换器的基波近似（FHA）增益曲线，可在 MATLAB 或 GNU Octave 中运行，无需工具箱。"
    tools: [MATLAB, GNU Octave]
    files:
      - /assets/downloads/llc-converter/llc_fha_gain.m
    links:
      - url: /resources/blog/llc-resonant-converter/
        localised: true
        label: {en: "LLC tutorial", zh: "LLC 教程"}

  # ── Tools & Agents ──
  - registry: aipe.sketch
    zh_summary: "把显式的电路中间表示（Circuit IR）渲染为经过连接性检查、带来源记录的 SVG 原理图。"
    category: tools
    domains: [converters]
    featured: 3
    card:
