      zh: "使用 AIPE Magnetics 进行材料比较、磁芯损耗估算以及电感与变压器选型。结果注明模型适用范围，尚未经过测量验证。"
    card:
      status: in-development
      summary:
        en: "Material comparison, core-loss estimation and inductor and transformer sizing with AIPE Magnetics. Results are not yet verified against measurements."
        zh: "使用 AIPE Magnetics 进行材料比较、磁芯损耗估算以及电感与变压器选型。结果尚未经过测量验证。"

  # ── Reference designs ── (pages published by this website; kept at their
  # URLs and linked from Workflows, but not shown as workflow cards)
  - id: site.dab-reference
    category: workflows
    type: reference_design
    status: reference
    domains: [converters]
    featured: 6
    url: /resources/prototypes/dab/
    localised: true
    title: {en: "DAB converter design reference", zh: "DAB 变换器设计参考"}
    description:
