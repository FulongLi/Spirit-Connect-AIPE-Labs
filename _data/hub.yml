        en: "Generate clear and structured electrical schematics automatically."
        zh: "自动生成清晰、结构化的电路原理图。"
    links:
      - url: /resources/ai-agent-team/aipe-sketch/
        localised: true
        label: {en: "Guide", zh: "使用指南"}
  # Not yet in the Registry, so the website describes it until it is listed.
  - id: site.pcb-agent
    category: tools
    type: agent
    status: prototype
    domains: [converters]
    url: https://github.com/FulongLi/AIPE-PCB-Agent
